<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="表面處理試算">
<title>表面處理試算｜勁格科技</title>
<style>
:root {
  --bg:#0d1117; --s1:#161b22; --s2:#1c2330; --border:#30363d;
  --blue:#58a6ff; --green:#3fb950; --yellow:#e3b341; --red:#f85149;
  --purple:#bc8cff; --orange:#e8a020;
  --text:#e6edf3; --muted:#8b949e; --text3:#484f58;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;min-height:100dvh;display:flex;flex-direction:column;}
header{background:var(--s1);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;}
.logo-wrap{width:38px;height:38px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;}
.logo-wrap img{width:100%;height:100%;object-fit:contain;}
.header-text h1{font-size:15px;font-weight:700;}
.header-text p{font-size:11px;color:var(--muted);margin-top:1px;}
main{flex:1;padding:20px 16px 60px;max-width:560px;width:100%;margin:0 auto;}

/* 卡片 */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
.sec-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* 類型切換 */
.type-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-group.four{grid-template-columns:1fr 1fr;}
.type-btn{background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:12px 8px;cursor:pointer;transition:all .15s;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;}
.type-btn .icon{font-size:22px;}
.type-btn:hover{border-color:var(--blue);color:var(--text);}
.type-btn.active{background:rgba(88,166,255,.1);border-color:var(--blue);color:var(--text);}

/* 輸入 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.field label .unit{color:var(--orange);margin-left:4px;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-prefix{position:absolute;left:11px;font-size:13px;color:var(--orange);font-weight:700;pointer-events:none;}
input[type=number]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;font-weight:600;padding:9px 44px 9px 30px;outline:none;transition:border-color .15s;-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(88,166,255,.12);}
.input-unit{position:absolute;right:10px;font-size:12px;color:var(--muted);pointer-events:none;}
input[type=number]:disabled{opacity:.35;cursor:not-allowed;}

/* 工序區塊 */
.process-section{margin-bottom:12px;}
.process-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.process-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.process-title{font-size:13px;font-weight:700;letter-spacing:.5px;}
.process-inactive{opacity:.35;pointer-events:none;}

/* CR 選擇 */
.cr-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.cr-btn{background:var(--s2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer;transition:all .15s;}
.cr-btn:hover{border-color:var(--purple);color:var(--text);}
.cr-btn.active{background:rgba(188,140,255,.12);border-color:var(--purple);color:var(--text);}
.mode-btn{background:var(--s2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer;transition:all .15s;}
.mode-btn:hover{border-color:var(--blue);color:var(--text);}
.mode-btn.active{background:rgba(88,166,255,.12);border-color:var(--blue);color:var(--text);}

/* 結果列 */
.result-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;}
.result-row:last-child{border-bottom:none;}
.rl{color:var(--muted);}
.rv{font-weight:700;font-family:'Courier New',monospace;font-size:13px;}
.rv.green{font-size:17px;}
.rv.green{color:var(--green);}
.rv.yellow{color:var(--yellow);}
.rv.red{color:var(--red);}
.rv.muted{color:var(--muted);}

/* 廠商列表 */
.vendor-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.vendor-grid.three{grid-template-columns:1fr 1fr 1fr;}
.vendor-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px;}
.vendor-card.na{opacity:.4;}
.v-name{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.v-badge{font-size:9px;padding:1px 6px;border-radius:10px;}
.badge-na{background:rgba(139,148,158,.1);color:var(--text3);border:1px solid var(--border);}
.v-price{font-size:18px;font-weight:900;color:var(--green);font-family:'Courier New',monospace;}
.vendor-card.na .v-price{color:var(--muted);}
.v-detail{font-size:10px;color:var(--text3);margin-top:4px;}

/* 合計 */
.total-card{background:linear-gradient(135deg,#0e2a4a,#0d1a2e);border:1px solid var(--blue);border-radius:var(--radius);padding:20px;text-align:center;margin-top:4px;}
.total-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.total-value{font-size:34px;font-weight:900;color:var(--orange);letter-spacing:-1px;font-family:'Courier New',monospace;}
.total-note{font-size:11px;color:var(--muted);margin-top:6px;}

/* 提示 */
.hint{background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--yellow);border-radius:0 8px 8px 0;padding:10px 14px;font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:12px;}
.hint span{color:var(--yellow);font-weight:700;}

.empty{text-align:center;padding:24px;color:var(--text3);font-size:12px;}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:pop .18s ease;}

footer{text-align:center;padding:14px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);}
</style>
</head>

<script>
// ── 狀態 ──
let workType = null; // 'shaft' | 'cylinder'
let crSel = null;
let grindPasses = 1;
let plateMode = null; // 'plate' | 'strip' | 'replate'
let surfaceSel = null;      // 軸心單選: 'grind'|'polish'
let cylinderSel = new Set(); // 鋼管複選: 'bore'|'polish'|'epolish'|'eplating'

// ── 常數 ──
const MM2IN2 = 645;
function areaIN2(d, l){ return Math.PI * d * l / MM2IN2; }
function nt(n){ return 'NT$ ' + Math.round(n).toLocaleString('zh-TW'); }
function fee(area, unit, minP){ return Math.max(area * unit, minP); }

// 研磨（外圓）
function grindFee(d, l, passes){
  const a = Math.PI * (d/25.4) * (l/25.4);
  const c1 = a * 2;
  const c2 = a * 2 * 1.5;
  const ld = l / d;
  const isLong = passes===1 && ld > 25;
  const sub = passes===1 ? c1 : c1 + c2;
  const total = Math.max(300, isLong ? sub * 2 : sub);
  return { area: a, c1, c2, isLong, ld, total, passes };
}

// 膛孔
function boreVendors(d, l){
  const a = areaIN2(d, l);
  const lf = { name:'利峰', unit:2.5, min:400, outOfRange: false };
  const yc = { name:'益川', unit:1.2, min:300, outOfRange: d < 20 || d > 160 };
  return [lf, yc].map(v => ({
    ...v,
    area: a,
    calc: a * v.unit,
    total: v.outOfRange ? null : Math.max(a * v.unit, v.min)
  }));
}

// 拋光（軸心）→ 只有宏光
function polishShaft(d, l){
  const a = areaIN2(d, l);
  return { area: a, unit: 1.725, min: 140, total: Math.max(a * 1.725, 140) };
}

// 拋光（鋼管）→ 利峰 + 益川 + 宏光
function polishCylinderVendors(d, l){
  const a = areaIN2(d, l);
  const lf = { name:'利峰', unit:2.0, min:400, outOfRange:false };
  const yc = { name:'益川', unit:1.2, min:300, outOfRange: d < 20 || d > 160 };
  const hg = { name:'宏光', unit:1.35, min:200, outOfRange: d > 150 && l > 1200 };
  return [lf, yc, hg].map(v => ({
    ...v, area: a, calc: a * v.unit,
    total: v.outOfRange ? null : Math.max(a * v.unit, v.min)
  }));
}

// 電鍍查表
const CR_SHAFT = ['cr4_6','cr6_8','cr15','cr20','cr25'];
const CR_CYLINDER = ['cr4_6','cr6_8','cr10','cr20'];
const CR_LABELS = { cr4_6:'CR 4-6條', cr6_8:'CR 6-8條', cr10:'CR 10條', cr15:'CR 15條', cr20:'CR 20條', cr25:'CR 25條' };

function plateFee(type, cr, d, l){
  if(!type||!cr||!d||!l) return null;
  const a = areaIN2(d, l);
  let unit, minP;
  if(type==='shaft'){
    if(d>400) return 'estimate';
    if(cr==='cr4_6'){ unit=d<=250?3.5:d<=400?4.5:null; minP=300; }
    else if(cr==='cr6_8'){ unit=d<=250?4.2:d<=400?5.2:null; minP=400; }
    else if(cr==='cr15'){
      if(d<=80){unit=5.4;minP=500;}
      else if(d<=120){if(l>3000)return 'estimate';unit=8.4;minP=500;}
      else if(d<=300){if(l>3000)return 'estimate';unit=11.4;minP=500;}
      else return 'estimate';
    }
    else if(cr==='cr20'){
      if(d<=80){unit=6.3;minP=1000;}
      else if(d<=120){if(l>3000)return 'estimate';unit=9.2;minP=1000;}
      else if(d<=300){if(l>3000)return 'estimate';unit=12.2;minP=1000;}
      else return 'estimate';
    }
    else if(cr==='cr25'){
      if(d<=80){unit=7.2;minP=1200;}
      else if(d<=120){if(l>3000)return 'estimate';unit=10;minP=1200;}
      else if(d<=300){if(l>3000)return 'estimate';unit=13;minP=1200;}
      else return 'estimate';
    }
  }
  if(type==='cylinder'){
    if(d>400||l>=3000) return 'estimate';
    if(cr==='cr4_6'){ unit=d<=300?3.5:d<=400?4.5:null; minP=380; }
    else if(cr==='cr6_8'){ unit=d<=300?4.2:d<=400?5.2:null; minP=550; }
    else if(cr==='cr10'){ unit=d<=300?5.7:d<=400?6.7:null; minP=720; }
    else if(cr==='cr20'){ unit=d<=300?6.3:d<=400?7.3:null; minP=1000; }
  }
  if(unit==null) return 'estimate';
  return { area:a, unit, minP, total: Math.max(a*unit, minP) };
}

// ── 設定零件類型 ──
function setType(t){
  workType = t;
  crSel = null;
  plateMode = null;
  surfaceSel = null;
  cylinderSel = new Set();
  document.getElementById('btn-shaft').classList.toggle('active', t==='shaft');
  document.getElementById('btn-cylinder').classList.toggle('active', t==='cylinder');
  document.getElementById('diaLabel').innerHTML = t==='shaft'
    ? '外徑 <span class="unit">mm</span>'
    : '內徑 <span class="unit">mm</span>';
  renderProcessArea();
  calculate();
}

// ── 渲染工序區 ──
function renderProcessArea(){
  const pa = document.getElementById('processArea');
  if(!workType){ pa.innerHTML=''; return; }
  const crOpts = workType==='shaft' ? CR_SHAFT : CR_CYLINDER;

  // 上方：表面處理選項
  const d0 = parseFloat(document.getElementById('dia').value)||0;
  const l0 = parseFloat(document.getElementById('len').value)||0;
  const needsExtra = workType==='cylinder' && (d0 >= 250 || l0 > 1200);

  const shaftOpts = [{id:'grind', color:'#58a6ff', label:'研磨'}, {id:'polish', color:'#bc8cff', label:'拋光'}];
  const cylAllOpts = [
    {id:'bore',     color:'#3fb950', label:'膛孔'},
    {id:'polish',   color:'#bc8cff', label:'拋光'},
    {id:'epolish',  color:'#e8a020', label:'電鍍後拋光'},
    {id:'eplating', color:'#f85149', label:'電鍍後膛孔'},
  ];
  const plateProc = {id:'plate', color:'#e3b341', label:'電鍍（宏光）'};

  let html = '';

  // 表面處理切換卡
  if(workType==='shaft'){
    html += `<div class="card">
      <div class="sec-label">表面處理</div>
      <div class="type-group">`;
    shaftOpts.forEach(s => {
      html += `<button class="type-btn${surfaceSel===s.id?' active':''}" style="border-color:${surfaceSel===s.id?s.color:''};" onclick="setSurface('${s.id}')">
        <span style="font-size:13px;font-weight:700;color:${s.color}">${s.label}</span>
      </button>`;
    });
    html += `</div>
      <div id="result-surface" style="margin-top:10px;"></div>
    </div>`;
  } else {
    // 鋼管：四個選項永遠顯示，全部可複選
    html += `<div class="card">
      <div class="sec-label">表面處理（可複選）</div>
      <div class="type-group four">`;
    cylAllOpts.forEach(s => {
      const act = cylinderSel.has(s.id);
      const isExtra = s.id==='epolish' || s.id==='eplating';
      const hint = isExtra && needsExtra ? `<span style="font-size:9px;color:var(--yellow);margin-top:2px;">⚠ 建議</span>` : '';
      html += `<button class="type-btn${act?' active':''}" style="border-color:${act?s.color:''};" onclick="toggleCylinder('${s.id}')">
        <span style="font-size:13px;font-weight:700;color:${s.color}">${s.label}</span>
        ${hint}
      </button>`;
    });
    html += `</div>`;
    if(needsExtra){
      html += `<div class="hint" style="margin-top:10px;margin-bottom:0;"><span>⚠ 提示</span>　Ø${d0} × L${l0} mm 超出宏光可處理範圍（ØØ&lt;200lt;250 且 L≤1200），建議選擇電鍍後拋光或電鍍後膛孔</div>`;
    }
    html += `<div id="result-surface" style="margin-top:10px;"></div>
    </div>`;
  }

  // 電鍍卡
  const processes = [plateProc];
  processes.forEach(p => {
    html += `<div class="card process-section" id="proc-${p.id}">
      <div class="process-header">
        <div class="process-dot" style="background:${p.color}"></div>
        <div class="process-title" style="color:${p.color}">${p.label}</div>
      </div>`;

        if(p.id==='plate'){
      html += `<div class="sec-label">電鍍工序</div>
      <div class="cr-grid" style="margin-bottom:10px;">
        <button class="mode-btn${plateMode==='plate'?' active':''}" onclick="setPlateMode('plate')">電鍍</button>
        <button class="mode-btn${plateMode==='strip'?' active':''}" onclick="setPlateMode('strip')">純退電</button>
        <button class="mode-btn${plateMode==='replate'?' active':''}" onclick="setPlateMode('replate')">退電再電</button>
      </div>`;
      if(plateMode==='plate'||plateMode==='replate'){
        html += `<div class="sec-label">CR 條數</div><div class="cr-grid">`;
        crOpts.forEach(c => {
          html += `<button class="cr-btn${crSel===c?' active':''}" onclick="setCR('${c}')">${CR_LABELS[c]}</button>`;
        });
        html += `</div>`;
      }
    }

    html += `<div id="result-${p.id}" class="anim"></div></div>`;
  });
  pa.innerHTML = html;
}

function setSurface(id){
  surfaceSel = surfaceSel===id ? null : id;
  renderProcessArea();
  calculate();
}

function toggleCylinder(id){
  if(cylinderSel.has(id)) cylinderSel.delete(id);
  else cylinderSel.add(id);
  renderProcessArea();
  calculate();
}

function setGrindPasses(n){
  grindPasses = n;
  document.querySelectorAll('.pass-toggle .cr-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim()===(n===1?'一次研磨':'二次研磨'));
  });
  calculate();
}

function setPlateMode(mode){
  plateMode = plateMode===mode ? null : mode;
  if(plateMode!=='plate' && plateMode!=='replate') crSel = null;
  renderProcessArea();
  calculate();
}

function setCR(val){
  crSel = crSel===val ? null : val;
  document.querySelectorAll('.cr-grid .cr-btn').forEach(b => {
    b.classList.remove('active');
  });
  if(crSel){
    document.querySelectorAll('.cr-grid .cr-btn').forEach(b => {
      if(b.textContent.trim()===CR_LABELS[crSel]) b.classList.add('active');
    });
  }
  calculate();
}

// ── 主計算 ──
function calculate(){
  if(!workType) return;
  const d = parseFloat(document.getElementById('dia').value)||0;
  const l = parseFloat(document.getElementById('len').value)||0;

  // 表面處理
  const rs = document.getElementById('result-surface');
  if(rs){
    if(workType==='shaft'){
      // 軸心單選
      if(!surfaceSel){
        rs.innerHTML='<div class="empty">請選擇研磨或拋光</div>';
      } else if(d<=0||l<=0){
        rs.innerHTML='<div class="empty">輸入尺寸後自動計算</div>';
      } else if(surfaceSel==='grind'){
        const g = grindFee(d,l,grindPasses);
        let rows = `<div class="cr-grid" style="margin-bottom:10px;">
          <button class="cr-btn${grindPasses===1?' active':''}" onclick="setGrindPasses(1)">一次研磨</button>
          <button class="cr-btn${grindPasses===2?' active':''}" onclick="setGrindPasses(2)">二次研磨</button>
        </div>
        <div class="result-card anim">
          <div class="result-row"><span class="rl">研磨面積（單件）</span><span class="rv yellow">${g.area.toFixed(2)} in²</span></div>
          <div class="result-row"><span class="rl">L/D 比值</span><span class="rv ${g.isLong?'red':''}">${g.ld.toFixed(1)}${g.isLong?' ⚠️ 細長加倍':''}</span></div>
          <div class="result-row"><span class="rl">第一次研磨費（×2）</span><span class="rv">${nt(g.c1)}</span></div>`;
        if(g.passes===2) rows += `<div class="result-row"><span class="rl">第二次研磨費（×2×1.5）</span><span class="rv">${nt(g.c2)}</span></div>`;
        if(g.isLong)     rows += `<div class="result-row"><span class="rl">細長附加（L/D>25，×2）</span><span class="rv red">${nt(g.passes===1?g.c1:g.c1+g.c2)}</span></div>`;
        rows += `<div class="result-row"><span class="rl">費用${g.total===300?' (最低計費)':''}</span><span class="rv green">${nt(g.total)}</span></div></div>`;
        rs.innerHTML = rows;
      } else if(surfaceSel==='polish'){
        const p = polishShaft(d,l);
        rs.innerHTML = `<div class="result-card anim">
          <div class="result-row"><span class="rl">面積</span><span class="rv yellow">${p.area.toFixed(2)} in²</span></div>
          <div class="result-row"><span class="rl">宏光 @${p.unit}元/in²，最低NT$${p.min}</span><span class="rv green">${nt(p.total)}</span></div>
        </div>`;
      }
    } else {
      // 鋼管複選：各項目分段顯示
      if(d<=0||l<=0){
        rs.innerHTML='<div class="empty">輸入尺寸後自動計算</div>';
      } else if(cylinderSel.size===0){
        rs.innerHTML='<div class="empty">請選擇表面處理項目</div>';
      } else {
        let html = '';
        if(cylinderSel.has('bore')){
          const vs = boreVendors(d,l);
          html += `<div class="sec-label" style="margin-top:8px;">膛孔</div>` + renderVendorGrid(vs, false);
        }
        if(cylinderSel.has('polish')){
          const vs = polishCylinderVendors(d,l);
          html += `<div class="sec-label" style="margin-top:8px;">拋光</div>` + renderVendorGrid(vs, true);
        }
        if(cylinderSel.has('epolish')){
          const vs = polishCylinderVendors(d,l).filter(v=>v.name!=='宏光');
          html += `<div class="sec-label" style="margin-top:8px;">電鍍後拋光</div>` + renderVendorGrid(vs, false);
        }
        if(cylinderSel.has('eplating')){
          const vs = boreVendors(d,l);
          html += `<div class="sec-label" style="margin-top:8px;">電鍍後膛孔</div>` + renderVendorGrid(vs, false);
        }
        rs.innerHTML = html;
      }
    }
  }

  // 電鍍（共用）
  const rpl = document.getElementById('result-plate');
  if(rpl){
    if(d>0&&l>0){
      if(!plateMode){
        rpl.innerHTML='<div class="empty">請選擇電鍍工序</div>';
      } else if(plateMode==='strip'){
        // 純退電
        const a = areaIN2(d,l);
        const stripTotal = a * 1.6;
        rpl.innerHTML=`<div class="result-card anim">
          <div class="result-row"><span class="rl">面積</span><span class="rv yellow">${a.toFixed(2)} in²</span></div>
          <div class="result-row"><span class="rl">純退電 @1.6元/in²</span><span class="rv green">${nt(stripTotal)}</span></div>
        </div>`;
      } else if(plateMode==='plate'){
        // 電鍍
        if(!crSel){
          rpl.innerHTML='<div class="empty">請選擇 CR 條數</div>';
        } else {
          const info = plateFee(workType, crSel, d, l);
          if(info==='estimate'){
            rpl.innerHTML=`<div class="result-card anim">
              <div class="result-row"><span class="rl">超出尺寸範圍</span><span class="rv red">需洽宏光估價</span></div>
            </div>`;
          } else if(info){
            rpl.innerHTML=`<div class="result-card anim">
              <div class="result-row"><span class="rl">面積</span><span class="rv yellow">${info.area.toFixed(2)} in²</span></div>
              <div class="result-row"><span class="rl">單價 ${info.unit}元/in²，最低NT$${info.minP}</span><span class="rv green">${nt(info.total)}</span></div>
            </div>`;
          }
        }
      } else if(plateMode==='replate'){
        // 退電再電
        if(!crSel){
          rpl.innerHTML='<div class="empty">請選擇 CR 條數</div>';
        } else {
          const info = plateFee(workType, crSel, d, l);
          const a = areaIN2(d,l);
          const stripFee = a * 1.0;
          if(info==='estimate'){
            rpl.innerHTML=`<div class="result-card anim">
              <div class="result-row"><span class="rl">退電費 @1元/in²</span><span class="rv">${nt(stripFee)}</span></div>
              <div class="result-row"><span class="rl">電鍍費（超出範圍）</span><span class="rv red">需洽宏光估價</span></div>
            </div>`;
          } else if(info){
            rpl.innerHTML=`<div class="result-card anim">
              <div class="result-row"><span class="rl">面積</span><span class="rv yellow">${a.toFixed(2)} in²</span></div>
              <div class="result-row"><span class="rl">退電費 @1元/in²</span><span class="rv">${nt(stripFee)}</span></div>
              <div class="result-row"><span class="rl">電鍍費 @${info.unit}元/in²，最低NT$${info.minP}</span><span class="rv">${nt(info.total)}</span></div>
              <div class="result-row"><span class="rl">合計</span><span class="rv green">${nt(stripFee+info.total)}</span></div>
            </div>`;
          }
        }
      }
    } else { rpl.innerHTML='<div class="empty">輸入尺寸後自動計算</div>'; }
  }

  // 合計
  const ta = document.getElementById('totalArea');
  if(ta){
    if(d>0 && l>0){
      let total = 0;
      let hasEstimate = false;

      // 表面處理費
      if(workType==='shaft'){
        if(surfaceSel==='grind') total += grindFee(d,l,grindPasses).total;
        else if(surfaceSel==='polish') total += polishShaft(d,l).total;
      } else {
        if(cylinderSel.has('bore')){
          const vs = boreVendors(d,l).filter(v=>!v.outOfRange);
          if(vs.length) total += Math.min(...vs.map(v=>v.total));
        }
        if(cylinderSel.has('polish')){
          const vs = polishCylinderVendors(d,l).filter(v=>!v.outOfRange);
          if(vs.length) total += Math.min(...vs.map(v=>v.total));
        }
        if(cylinderSel.has('epolish')){
          const vs = polishCylinderVendors(d,l).filter(v=>!v.outOfRange && v.name!=='宏光');
          if(vs.length) total += Math.min(...vs.map(v=>v.total));
        }
        if(cylinderSel.has('eplating')){
          const vs = boreVendors(d,l).filter(v=>!v.outOfRange);
          if(vs.length) total += Math.min(...vs.map(v=>v.total));
        }
      }

      // 電鍍費
      if(plateMode==='strip'){
        total += areaIN2(d,l) * 1.6;
      } else if(plateMode==='plate' && crSel){
        const info = plateFee(workType, crSel, d, l);
        if(info==='estimate') hasEstimate=true;
        else if(info) total += info.total;
      } else if(plateMode==='replate' && crSel){
        const info = plateFee(workType, crSel, d, l);
        const stripFee = areaIN2(d,l) * 1.0;
        total += stripFee;
        if(info==='estimate') hasEstimate=true;
        else if(info) total += info.total;
      }

      if(total>0){
        const note = hasEstimate ? '⚠ 部分工序需估價，合計不含估價項目' : `Ø${d} × L${l} mm`;
        ta.innerHTML=`<div class="total-card anim">
          <div class="total-label">各工序合計</div>
          <div class="total-value">${nt(total)}</div>
          <div class="total-note">${note}</div>
        </div>`;
      } else {
        ta.innerHTML='';
      }
    } else {
      ta.innerHTML='';
    }
  }

}

function renderVendorGrid(vendors, isThree, unused, subLabel){
  const gridClass = isThree ? 'vendor-grid three' : 'vendor-grid';
  let html = `<div class="${gridClass} anim">`;
  vendors.forEach(v => {
    const naClass = v.outOfRange ? ' na' : '';
    const badge = v.outOfRange ? `<span class="v-badge badge-na">不適用</span>` : '';
    const priceStr = v.outOfRange ? '—' : nt(v.total);
    let detail = v.outOfRange ? '' : `${v.unit}元/in² · 最低NT$${v.min}`;
    if(v.label2) detail += ` · ${v.label2}`;
    if(v.name==='宏光' && !v.outOfRange) detail += '（Ø≤150 或 L≤1200）';
    html += `<div class="vendor-card${naClass}">
      <div class="v-name">${v.name}${badge}</div>
      <div class="v-price">${priceStr}</div>
      <div class="v-detail">${detail}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}
