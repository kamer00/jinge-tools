<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密封件選型工具 | 勁格科技</title>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3348;
  --accent:#e8a020; --text:#e2e6f0; --text-dim:#7a8099; --text-muted:#4a5068;
  --green:#2ecc71; --blue:#3a7bd5; --red:#e74c3c;
  --c-piston:#1e3a5a; --c-rod:#1a3a2e; --c-dust:#3a2a1a;
  --c-piston-b:#4a8abf; --c-rod-b:#4abf7a; --c-dust-b:#bf8a4a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','Microsoft JhengHei',sans-serif;font-size:14px;min-height:100vh;}

header{background:var(--surface);border-bottom:2px solid var(--accent);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.logo{background:var(--accent);color:#000;font-weight:700;font-size:11px;padding:4px 8px;letter-spacing:1px;}
header h1{font-size:15px;font-weight:600;}
header small{color:var(--text-muted);font-size:11px;margin-left:auto;}

.container{max-width:1440px;margin:0 auto;padding:20px;}

/* SEARCH PANEL */
.search-panel{background:var(--surface);border:1px solid var(--border);padding:18px 20px;margin-bottom:16px;}
.panel-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:14px;}
.search-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;min-width:120px;}
.field.wide{min-width:160px;}
label{font-size:10px;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase;}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%;}
input:focus,select:focus{border-color:var(--accent);}
select option{background:var(--bg);}
.field-sep{display:flex;align-items:flex-end;padding-bottom:8px;color:var(--text-muted);font-size:18px;font-weight:300;}
.btn-row{display:flex;gap:8px;align-items:flex-end;padding-bottom:1px;}
.btn{background:var(--accent);color:#000;border:none;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.85;}
.btn-sub{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-sub:hover{border-color:var(--text-dim);opacity:1;}
.hint{font-size:10px;color:var(--text-muted);margin-top:3px;}

/* RECOMMENDATION */
.rec-box{background:linear-gradient(135deg,#0f1f0f,#1a1d27);border:1px solid #2a4a2a;border-left:3px solid var(--green);padding:14px 16px;margin-bottom:16px;display:none;}
.rec-box.show{display:block;}
.rec-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:10px;}
.rec-items{display:flex;flex-direction:column;gap:7px;}
.rec-item{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.5;}
.rec-badge{font-size:10px;font-weight:700;padding:2px 6px;flex-shrink:0;margin-top:2px;min-width:22px;text-align:center;}
.rb1{background:var(--green);color:#000;}
.rb2{background:#999;color:#000;}
.rbtip{background:#2a4a6a;color:#7ab8f5;}
.rec-item strong{color:var(--text);}
.rec-item span{color:var(--text-dim);}

/* RESULTS */
.results-area{display:flex;flex-direction:column;gap:16px;}

/* SECTION */
.section{background:var(--surface);border:1px solid var(--border);}
.section-header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.section-icon{font-size:16px;}
.section-label{font-size:12px;font-weight:700;letter-spacing:.5px;}
.section-count{font-size:11px;color:var(--text-dim);margin-left:auto;}
.section-toggle{color:var(--text-muted);font-size:10px;}
.section.piston .section-header{border-left:3px solid var(--c-piston-b);}
.section.rod .section-header{border-left:3px solid var(--c-rod-b);}
.section.dust .section-header{border-left:3px solid var(--c-dust-b);}
.section-body{overflow-x:auto;}
.section-body.collapsed{display:none;}

table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--surface2);}
th{padding:8px 10px;text-align:left;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;}
th:hover{color:var(--accent);}
th.sorted-asc::after{content:' ▲';}
th.sorted-desc::after{content:' ▼';}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--surface2);}
td{padding:7px 10px;vertical-align:middle;}

.brand-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border:1px solid var(--border);border-radius:0;}
.bb-nok{border-color:#3a5a8a;color:#7ab8f5;}
.bb-valqua{border-color:#2a5a3a;color:#7af5a8;}
.bb-hallite{border-color:#5a2a2a;color:#f57a7a;}
.bb-sakagami{border-color:#5a4a2a;color:#f5d07a;}
.bb-parker{border-color:#4a2a6a;color:#c07af5;}

.model{font-family:'Consolas','Courier New',monospace;font-size:12px;color:var(--accent);font-weight:600;}
.mat{font-size:10px;padding:1px 4px;border:1px solid var(--border);}
.mat-pu{border-color:#3a5a8a;color:#7ab8f5;}
.mat-nbr{border-color:#4a4a2a;color:#c8c870;}
.mat-ptfe{border-color:#3a5a3a;color:#70c870;}
.mat-tpe{border-color:#5a3a5a;color:#c870c8;}
.mat-mix{border-color:#4a3a2a;color:#c8a070;}
.pbar{font-size:11px;} .pbar strong{color:var(--text);}
.temp{font-size:10px;color:var(--text-muted);}
.note-cell{font-size:10px;color:var(--text-muted);}
.price-cell{font-size:11px;color:var(--text-muted);font-style:italic;}

/* SUMMARY BAR */
.summary-bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.sum-item{font-size:12px;color:var(--text-dim);}
.sum-item strong{color:var(--accent);}
.brand-tags{display:flex;gap:6px;flex-wrap:wrap;}
.btag{font-size:10px;padding:3px 8px;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s;}
.btag:hover{border-color:var(--text-dim);}
.btag.on{border-color:var(--accent);color:var(--accent);}

/* EMPTY */
.empty{text-align:center;padding:40px;color:var(--text-muted);}
.empty .ico{font-size:32px;margin-bottom:10px;}
.empty p{font-size:13px;}
.empty small{font-size:11px;}

@media(max-width:768px){
  .search-row{flex-direction:column;}
  .field,.field.wide{min-width:0;width:100%;}
  .field-sep{display:none;}
  table{font-size:11px;}
  td,th{padding:6px 7px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">JINGER</div>
  <h1>密封件選型工具</h1>
  <small>Hallite / VALQUA / NOK / SAKAGAMI / PARKER</small>
</header>

<div class="container">

  <!-- SEARCH -->
  <div class="search-panel">
    <div class="panel-title">▍ 油缸尺寸輸入</div>
    <div class="search-row">
      <div class="field">
        <label>缸徑 D (mm)</label>
        <input type="number" id="inD" placeholder="例：100" min="1" step="0.1">
        <div class="hint">活塞密封依此查詢</div>
      </div>
      <div class="field-sep">×</div>
      <div class="field">
        <label>軸徑 d (mm)</label>
        <input type="number" id="ind" placeholder="例：70" min="1" step="0.1">
        <div class="hint">桿密封 / 防塵依此查詢</div>
      </div>
      <div class="field">
        <label>容差 (mm)</label>
        <select id="tol">
          <option value="0">精確</option>
          <option value="0.5">± 0.5</option>
          <option value="1" selected>± 1.0</option>
          <option value="2">± 2.0</option>
          <option value="5">± 5.0</option>
        </select>
      </div>
      <div class="field wide">
        <label>用途</label>
        <select id="selUsage">
          <option value="all">全部（油壓 + 空壓）</option>
          <option value="oil" selected>油壓</option>
          <option value="air">空壓</option>
        </select>
      </div>
      <div class="field wide">
        <label>品牌</label>
        <select id="selBrand">
          <option value="all">全部品牌</option>
          <option value="NOK">NOK</option>
          <option value="VALQUA">VALQUA</option>
          <option value="Hallite">Hallite</option>
          <option value="SAKAGAMI">SAKAGAMI</option>
          <option value="PARKER">PARKER</option>
        </select>
      </div>
      <div class="field">
        <label>壓力需求 (bar)</label>
        <select id="selP">
          <option value="0">不限</option>
          <option value="100">≥ 100</option>
          <option value="200">≥ 200</option>
          <option value="350">≥ 350</option>
          <option value="400">≥ 400</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="doSearch()">🔍 查詢</button>
        <button class="btn btn-sub" onclick="clearAll()">清除</button>
      </div>
    </div>
  </div>

  <!-- RECOMMENDATION -->
  <div class="rec-box" id="recBox">
    <div class="rec-title">▍ 採購建議</div>
    <div class="rec-items" id="recContent"></div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-bar" id="summaryBar" style="display:none;">
    <div class="sum-item" id="sumText"></div>
    <div class="brand-tags" id="brandTags"></div>
  </div>

  <!-- RESULTS -->
  <div class="results-area" id="resultsArea">
    <div class="empty">
      <div class="ico">🔩</div>
      <p>輸入缸徑 D 與軸徑 d 查詢整支油缸密封件</p>
      <small>結果將分為：活塞密封 / 桿側密封 / 防塵圈 三區顯示</small>
    </div>
  </div>

</div>

// ============================================================
// STATE
// ============================================================
let sections = { piston:[], rod:[], dust:[] };
let sortState = { piston:{k:'',d:'asc'}, rod:{k:'',d:'asc'}, dust:{k:'',d:'asc'} };
let collapsed = { piston:false, rod:false, dust:false };

// ============================================================
// SEARCH
// ============================================================
function doSearch() {
  const D = parseFloat(document.getElementById('inD').value);
  const d = parseFloat(document.getElementById('ind').value);
  if (!D && !d) { alert('請至少輸入缸徑 D 或軸徑 d 其中一個'); return; }

  const tol = parseFloat(document.getElementById('tol').value);
  const usage = document.getElementById('selUsage').value;
  const brand = document.getElementById('selBrand').value;
  const minP = parseFloat(document.getElementById('selP').value);

  const matchD = (s) => D && Math.abs(s.D - D) <= tol;
  const matchd = (s) => d && Math.abs(s.d - d) <= tol;
  const base = (s) => {
    if (usage !== 'all' && s.usage !== usage) return false;
    if (brand !== 'all' && s.brand !== brand) return false;
    if (minP > 0 && s.pressure > 0 && s.pressure < minP) return false;
    return true;
  };

  // 活塞密封：依缸徑 D 查，func = piston 或 dual
  sections.piston = SEAL_DB.filter(s =>
    matchD(s) && base(s) && (s.func === 'piston' || s.func === 'dual')
  );
  // 桿密封：依軸徑 d 查，func = rod 或 dual
  sections.rod = SEAL_DB.filter(s =>
    matchd(s) && base(s) && (s.func === 'rod' || s.func === 'dual')
  );
  // 防塵圈：依軸徑 d 查，func = dust
  sections.dust = SEAL_DB.filter(s =>
    matchd(s) && base(s) && s.func === 'dust'
  );

  const total = sections.piston.length + sections.rod.length + sections.dust.length;
  renderAll();
  renderSummary(total);
  renderRec(D, d, usage, minP);
}

function clearAll() {
  document.getElementById('inD').value = '';
  document.getElementById('ind').value = '';
  document.getElementById('tol').value = '1';
  document.getElementById('selUsage').value = 'oil';
  document.getElementById('selBrand').value = 'all';
  document.getElementById('selP').value = '0';
  sections = { piston:[], rod:[], dust:[] };
  document.getElementById('resultsArea').innerHTML = `<div class="empty"><div class="ico">🔩</div><p>輸入缸徑 D 與軸徑 d 查詢整支油缸密封件</p><small>結果將分為：活塞密封 / 桿側密封 / 防塵圈 三區顯示</small></div>`;
  document.getElementById('recBox').classList.remove('show');
  document.getElementById('summaryBar').style.display = 'none';
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  const area = document.getElementById('resultsArea');
  area.innerHTML = '';
  renderSection('piston', '🔴 活塞密封（缸徑 D）', area);
  renderSection('rod',    '🟢 桿側密封（軸徑 d）', area);
  renderSection('dust',   '🟡 防塵圈（軸徑 d）',   area);
}

function renderSection(key, label, container) {
  const data = sections[key];
  const div = document.createElement('div');
  div.className = `section ${key}`;
  div.id = `sec-${key}`;

  const header = document.createElement('div');
  header.className = 'section-header';
  header.onclick = () => toggleSection(key);
  header.innerHTML = `
    <span class="section-label">${label}</span>
    <span class="section-count">${data.length} 筆</span>
    <span class="section-toggle" id="tog-${key}">${collapsed[key]?'▶':'▼'}</span>
  `;

  const body = document.createElement('div');
  body.className = `section-body${collapsed[key]?' collapsed':''}`;
  body.id = `body-${key}`;

  if (!data.length) {
    body.innerHTML = `<div class="empty" style="padding:24px;"><p>查無符合規格</p></div>`;
  } else {
    body.appendChild(buildTable(key, data));
  }

  div.appendChild(header);
  div.appendChild(body);
  container.appendChild(div);
}

function buildTable(secKey, data) {
  const cols = [
    {k:'brand',  l:'品牌'},
    {k:'series', l:'系列'},
    {k:'code',   l:'型號'},
    {k:'d',      l:'d (mm)'},
    {k:'D',      l:'D (mm)'},
    {k:'H',      l:'H (mm)'},
    {k:'material',l:'材質'},
    {k:'pressure',l:'壓力'},
    {k:'tempMin', l:'溫度'},
    {k:null,      l:'單價(NT$)'},
    {k:'note',    l:'備註'},
  ];
  const ss = sortState[secKey];
  const thead = cols.map(c => {
    const cls = c.k && ss.k===c.k ? `sorted-${ss.d}` : '';
    const click = c.k ? `onclick="sortSec('${secKey}','${c.k}')"` : '';
    return `<th class="${cls}" ${click}>${c.l}</th>`;
  }).join('');

  const brandClass = {NOK:'nok',VALQUA:'valqua',Hallite:'hallite',SAKAGAMI:'sakagami',PARKER:'parker'};
  const matClass = (m) => {
    m = m.toLowerCase();
    if(m.includes('ptfe')) return 'ptfe';
    if(m.includes('pu')) return 'pu';
    if(m.includes('nbr')) return 'nbr';
    if(m.includes('tpe')) return 'tpe';
    return 'mix';
  };

  const rows = data.map(r => `
    <tr>
      <td><span class="brand-badge bb-${brandClass[r.brand]||''}">${r.brand}</span></td>
      <td>${r.series}</td>
      <td><span class="model">${r.code}</span></td>
      <td>${r.d}</td>
      <td>${r.D}</td>
      <td>${r.H}</td>
      <td><span class="mat mat-${matClass(r.material)}">${r.material}</span></td>
      <td class="pbar">${r.pressure>0?`<strong>${r.pressure}</strong> bar`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td class="temp">${r.tempMin}~${r.tempMax}°C</td>
      <td class="price-cell">—</td>
      <td class="note-cell">${r.note}</td>
    </tr>`).join('');

  const t = document.createElement('table');
  t.innerHTML = `<thead><tr>${thead}</tr></thead><tbody>${rows}</tbody>`;
  return t;
}

function toggleSection(key) {
  collapsed[key] = !collapsed[key];
  document.getElementById(`body-${key}`).classList.toggle('collapsed', collapsed[key]);
  document.getElementById(`tog-${key}`).textContent = collapsed[key]?'▶':'▼';
}

function sortSec(secKey, col) {
  const ss = sortState[secKey];
  if(ss.k === col) ss.d = ss.d==='asc'?'desc':'asc';
  else { ss.k=col; ss.d='asc'; }
  sections[secKey].sort((a,b) => {
    let av=a[col], bv=b[col];
    if(typeof av==='string') { av=av.toLowerCase(); bv=bv.toLowerCase(); }
    return ss.d==='asc' ? (av>bv?1:-1) : (av<bv?1:-1);
  });
  const body = document.getElementById(`body-${secKey}`);
  const wasCollapsed = body.classList.contains('collapsed');
  const newTbl = buildTable(secKey, sections[secKey]);
  body.innerHTML = '';
  body.appendChild(newTbl);
  if(wasCollapsed) body.classList.add('collapsed');
}

// ============================================================
// SUMMARY
// ============================================================
function renderSummary(total) {
  const bar = document.getElementById('summaryBar');
  bar.style.display = 'flex';
  document.getElementById('sumText').innerHTML =
    `活塞密封 <strong>${sections.piston.length}</strong> 筆 ／ 桿側密封 <strong>${sections.rod.length}</strong> 筆 ／ 防塵圈 <strong>${sections.dust.length}</strong> 筆`;

  const allData = [...sections.piston, ...sections.rod, ...sections.dust];
  const bc = {};
  allData.forEach(r => bc[r.brand]=(bc[r.brand]||0)+1);
  document.getElementById('brandTags').innerHTML =
    Object.entries(bc).map(([b,n])=>`<span class="btag on">${b} (${n})</span>`).join('');
}

// ============================================================
// RECOMMENDATION
// ============================================================
function renderRec(D, d, usage, minP) {
  const box = document.getElementById('recBox');
  const content = document.getElementById('recContent');
  const all = [...sections.piston, ...sections.rod, ...sections.dust];
  if(!all.length) { box.classList.remove('show'); return; }

  const rec = [];
  const brands = new Set(all.map(r=>r.brand));
  const maxP = Math.max(...all.filter(r=>r.pressure>0).map(r=>r.pressure), 0);

  // 活塞密封建議
  const pistHasNOK = sections.piston.some(r=>r.brand==='NOK');
  const pistHasVALQUA = sections.piston.some(r=>r.brand==='VALQUA');
  if(sections.piston.length) {
    if(pistHasNOK)
      rec.push({cls:'rb1', title:'活塞密封 → NOK GSP / SPG',
        desc:'首選。PTFE+青銅耐磨環，400bar，低摩擦係數，適合中鋼/中鴻等重載場合。'});
    else if(pistHasVALQUA)
      rec.push({cls:'rb1', title:'活塞密封 → VALQUA UHP / GPY',
        desc:'首選。PU或NBR材質，台灣代理商有庫存，交期短。'});
  }

  // 桿側密封建議
  const rodHasNOK = sections.rod.some(r=>r.brand==='NOK');
  const rodHasVALQUA = sections.rod.some(r=>r.brand==='VALQUA');
  const rodHasHallite = sections.rod.some(r=>r.brand==='Hallite');
  if(sections.rod.length) {
    if(rodHasNOK)
      rec.push({cls:'rb1', title:'桿側密封 → NOK GSR',
        desc:'首選。PTFE+青銅系列，400bar，建議搭配DKI防塵圈一組採購。'});
    else if(rodHasVALQUA)
      rec.push({cls:'rb1', title:'桿側密封 → VALQUA UHR / GNY',
        desc:'首選。UHR為小截面PU，GNY為NBR，依壓力選擇。'});
    else if(rodHasHallite)
      rec.push({cls:'rb1', title:'桿側密封 → Hallite TYPE 605',
        desc:'首選。雙唇PU設計，400bar，尺寸覆蓋最廣。'});
  }

  // 防塵圈建議
  const dustHasNOK = sections.dust.some(r=>r.brand==='NOK');
  if(sections.dust.length) {
    if(dustHasNOK)
      rec.push({cls:'rb2', title:'防塵圈 → NOK DKI / DKB',
        desc:'推薦。金屬殼設計，高震動環境適用；DKI為PU唇（低溫-35°C），DKB為NBR（-20°C）。'});
    else
      rec.push({cls:'rb2', title:'防塵圈 → SAKAGAMI SCK / SCB 或 VALQUA DHS / SDR',
        desc:'推薦。SCK/SCB為金屬殼；DHS/SDR為整體槽式，安裝簡便。'});
  }

  // 材質壓力提示
  if(maxP >= 350)
    rec.push({cls:'rbtip', title:'高壓提示（≥350bar）',
      desc:'建議採用PU或PTFE複合材質；壓力≥400bar加裝BRT背托環防擠出；溫度>100°C考慮FKM氟橡膠。'});
  else if(maxP > 0 && maxP < 200)
    rec.push({cls:'rbtip', title:'低壓場合（≤200bar）',
      desc:'NBR材質即可，成本低，庫存週轉快。建議UHS/SKY系列。'});

  if(!rec.length)
    rec.push({cls:'rbtip', title:'採購優先順序',
      desc:'建議：NOK → VALQUA → Hallite → SAKAGAMI。日系品牌品質穩定，台灣均有代理商。'});

  content.innerHTML = rec.map(r=>`
    <div class="rec-item">
      <span class="rec-badge ${r.cls}">${r.cls==='rb1'?'★':r.cls==='rb2'?'▶':'💡'}</span>
      <div><strong>${r.title}</strong><br><span>${r.desc}</span></div>
    </div>`).join('');
  box.classList.add('show');
}

// Enter 觸發
['inD','ind'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if(e.key==='Enter') doSearch();
  });
});
