<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公差查詢計算機 — 勁格科技</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3349;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --text: #e2e8f0;
    --muted: #64748b;
    --green: #10b981;
    --red: #ef4444;
    --orange: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', 'Noto Sans TC', monospace;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
  }
  .header p {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.1em;
  }

  /* Mode tabs */
  .mode-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    background: var(--surface);
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .mode-tab {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.78rem;
    cursor: pointer;
    border-radius: 5px;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .mode-tab.active {
    background: var(--accent);
    color: #000;
    font-weight: 700;
  }

  /* Input area */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .input-row {
    display: grid;
    gap: 14px;
    margin-bottom: 14px;
  }
  .input-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .input-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  label {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input[type="number"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="number"]:focus, select:focus {
    border-color: var(--accent);
  }
  select option { background: var(--surface2); }

  .btn-query {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #000;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-query:hover { opacity: 0.85; }

  /* Result area */
  .result-section {
    display: none;
  }
  .result-section.show { display: block; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .result-card.hole { border-left: 3px solid var(--accent2); }
  .result-card.shaft { border-left: 3px solid var(--orange); }
  .result-card.fit { border-left: 3px solid var(--green); }

  .card-title {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .symbol-big {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .size-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .tol-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .tol-item {
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px;
    text-align: center;
  }
  .tol-item .val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .tol-item .val.pos { color: var(--green); }
  .tol-item .val.neg { color: var(--red); }
  .tol-item .val.zero { color: var(--muted); }
  .tol-item .lbl {
    font-size: 0.62rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.08em;
  }

  .fit-type-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .clearance { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid var(--green); }
  .transition { background: rgba(245,158,11,0.15); color: var(--accent); border: 1px solid var(--accent); }
  .interference { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid var(--red); }

  .usage-text {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 6px;
  }

  /* Fit result */
  .fit-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .fit-val {
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px 14px;
    text-align: center;
  }
  .fit-val .val { font-size: 1.05rem; font-weight: 700; }
  .fit-val .lbl { font-size: 0.62rem; color: var(--muted); margin-top: 3px; }

  /* diagram */
  .tol-bar-wrap {
    margin: 12px 0;
    background: var(--surface2);
    border-radius: 6px;
    padding: 12px;
  }
  .tol-bar-label { font-size: 0.65rem; color: var(--muted); margin-bottom: 6px; }
  .bar-track {
    position: relative;
    height: 28px;
    background: var(--bg);
    border-radius: 4px;
    overflow: visible;
  }
  .zero-line {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--muted);
    opacity: 0.5;
  }
  .tol-bar {
    position: absolute;
    top: 4px;
    height: 20px;
    border-radius: 3px;
    opacity: 0.85;
    transition: all 0.4s;
  }
  .zero-tag {
    position: absolute;
    left: 50%;
    top: 32px;
    transform: translateX(-50%);
    font-size: 0.6rem;
    color: var(--muted);
  }

  .error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--red);
    font-size: 0.82rem;
    margin-bottom: 14px;
  }

  @media (max-width: 480px) {
    .input-row.cols-3 { grid-template-columns: 1fr 1fr; }
    .tol-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

  <h1>⚙ ISO 286 公差查詢</h1>
  <p>孔軸配合公差 · ISO 286 · 1–630 mm · 勁格科技內部工具</p>
</div>

<!-- Mode Tabs -->
<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('fit')">孔＋軸配合</button>
  <button class="mode-tab" onclick="setMode('hole')">單查孔</button>
  <button class="mode-tab" onclick="setMode('shaft')">單查軸</button>
</div>

<!-- Input -->
<div class="input-section">
  <div class="input-row cols-2" id="row-size-hole" style="display:none">
    <div>
      <label>公稱尺寸 (mm)</label>
      <input type="number" id="dia-hole" min="1" max="630" placeholder="例：50">
    </div>
    <div>
      <label>孔公差符號</label>
      <select id="sel-hole"></select>
    </div>
  </div>

  <div class="input-row cols-2" id="row-size-shaft" style="display:none">
    <div>
      <label>公稱尺寸 (mm)</label>
      <input type="number" id="dia-shaft" min="1" max="630" placeholder="例：50">
    </div>
    <div>
      <label>軸公差符號</label>
      <select id="sel-shaft-only"></select>
    </div>
  </div>

  <div id="row-fit" style="display:block">
    <div class="input-row cols-3">
      <div>
        <label>公稱尺寸 (mm)</label>
        <input type="number" id="dia-fit" min="1" max="630" placeholder="例：50" oninput="updateFitCombos()">
      </div>
      <div>
        <label>配合類型</label>
        <select id="sel-fit-type" onchange="updateFitCombos()">
          <option value="clearance">間隙配合</option>
          <option value="transition">過渡配合</option>
          <option value="interference">過盈配合</option>
        </select>
      </div>
      <div>
        <label>精度等級</label>
        <select id="sel-fit-grade" onchange="updateFitCombos()">
          <option value="precise">精密</option>
          <option value="normal" selected>一般</option>
          <option value="loose">寬鬆</option>
        </select>
      </div>
    </div>
    <div class="input-row" style="margin-bottom:0">
      <div>
        <label>建議組合</label>
        <select id="sel-fit-combo"></select>
      </div>
    </div>
  </div>

  <button class="btn-query" onclick="query()">▶ 查詢</button>
</div>

<!-- Result -->
<div class="result-section" id="result-area"></div>

<script>
// ── ISO 286 資料庫 ──────────────────────────────────────────
// 尺寸段 [min, max) → 各公差符號偏差 (μm)
// 正值=正偏差, 負值=負偏差
// 格式: { ES, EI } 孔 / { es, ei } 軸

const SIZE_RANGES = [
  [1,3],[3,6],[6,10],[10,18],[18,30],[30,50],[50,80],[80,120],
  [120,180],[180,250],[250,315],[315,400],[400,500],[500,630]

// 孔公差資料 [ES, EI] (μm) per size range (含500-630mm段)
const HOLE_DATA = {

  H11:[[60,0],[75,0],[90,0],[110,0],[130,0],[160,0],[190,0],[220,0],[250,0],[290,0],[320,0],[360,0],[400,0],[440,0]],
  JS7:[[5,-5],[6,-6],[7.5,-7.5],[9,-9],[10.5,-10.5],[12.5,-12.5],[15,-15],[17.5,-17.5],[20,-20],[23,-23],[26,-26],[28.5,-28.5],[31.5,-31.5],[35,-35]],
  K7: [[-4,-14],[-6,-18],[-7,-22],[-9,-27],[-11,-32],[-13,-38],[-15,-45],[-18,-53],[-21,-61],[-24,-70],[-27,-79],[-29,-86],[-32,-95],[-38,-108]],
};

// 軸公差資料 [es, ei] (μm) per size range (含500-630mm段)
const SHAFT_DATA = {
  f6: [[-6,-12],[-10,-18],[-13,-22],[-16,-27],[-20,-33],[-25,-41],[-30,-49],[-36,-58],[-43,-68],[-50,-79],[-56,-88],[-62,-98],[-68,-108],[-76,-120]],
  f7: [[-6,-16],[-10,-22],[-13,-28],[-16,-34],[-20,-41],[-25,-50],[-30,-60],[-36,-71],[-43,-83],[-50,-96],[-56,-108],[-62,-119],[-68,-131],[-76,-146]],
  g6: [[-2,-8],[-4,-12],[-5,-14],[-6,-17],[-7,-20],[-9,-25],[-10,-29],[-12,-34],[-14,-39],[-15,-44],[-17,-49],[-18,-54],[-20,-60],[-22,-66]],
  g7: [[-2,-12],[-4,-16],[-5,-20],[-6,-24],[-7,-28],[-9,-34],[-10,-40],[-12,-47],[-14,-54],[-15,-61],[-17,-69],[-18,-75],[-20,-83],[-22,-92]],
  h6: [[0,-6],[0,-8],[0,-9],[0,-11],[0,-13],[0,-16],[0,-19],[0,-22],[0,-25],[0,-29],[0,-32],[0,-36],[0,-40],[0,-44]],
  h7: [[0,-10],[0,-12],[0,-15],[0,-18],[0,-21],[0,-25],[0,-30],[0,-35],[0,-40],[0,-46],[0,-52],[0,-57],[0,-63],[0,-70]],

// ── 工具函數 ──────────────────────────────────────────────
function getSizeIndex(d) {
  for (let i = 0; i < SIZE_RANGES.length; i++) {
    if (d >= SIZE_RANGES[i][0] && d < SIZE_RANGES[i][1]) return i;
  }
  return -1;
}
function fmtMicron(v) {
  if (v === 0) return '0';
  return (v > 0 ? '+' : '') + v;
}
function fmtMM(v) {
  return (v > 0 ? '+' : '') + (v/1000).toFixed(3);
}
function valClass(v) {
  if (v > 0) return 'pos';
  if (v < 0) return 'neg';
  return 'zero';
}
function getSizeLabel(d) {
  const idx = getSizeIndex(d);
  if (idx < 0) return '';
  const r = SIZE_RANGES[idx];
  return `尺寸段 ${r[0]}–${r[1]} mm`;
}

// ── 渲染邏輯 ──────────────────────────────────────────────
let currentMode = 'fit';

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t,i) => {
    t.classList.toggle('active', ['fit','hole','shaft'][i] === mode);
  });
  document.getElementById('row-fit').style.display = mode==='fit' ? 'block' : 'none';
  document.getElementById('row-size-hole').style.display = mode==='hole' ? 'grid' : 'none';
  document.getElementById('row-size-shaft').style.display = mode==='shaft' ? 'grid' : 'none';
  document.getElementById('result-area').innerHTML = '';
  document.getElementById('result-area').classList.remove('show');
}

function query() {
  const area = document.getElementById('result-area');
  area.innerHTML = '';

  if (currentMode === 'fit') {
    const d = parseFloat(document.getElementById('dia-fit').value);
    const combo = document.getElementById('sel-fit-combo').value;
    if (!d || d < 1 || d > 630) { showError('請輸入有效公稱尺寸 (1–630 mm)', area); return; }
    if (!combo) { showError('請選擇建議組合', area); return; }
    const idx = getSizeIndex(d);
    if (idx < 0) { showError('尺寸超出 ISO 286 適用範圍', area); return; }
    const [hSym, sSym] = combo.split('/');
    area.innerHTML = renderHole(d, idx, hSym) + renderShaft(d, idx, sSym) + renderFit(d, idx, hSym, sSym);
  } else if (currentMode === 'hole') {
    const d = parseFloat(document.getElementById('dia-hole').value);
    const sym = document.getElementById('sel-hole').value;
    if (!d || d < 1 || d > 630) { showError('請輸入有效公稱尺寸 (1–630 mm)', area); return; }
    const idx = getSizeIndex(d);
    if (idx < 0) { showError('尺寸超出 ISO 286 適用範圍', area); return; }
    area.innerHTML = renderHole(d, idx, sym);
  } else {
    const d = parseFloat(document.getElementById('dia-shaft').value);
    const sym = document.getElementById('sel-shaft-only').value;
    if (!d || d < 1 || d > 630) { showError('請輸入有效公稱尺寸 (1–630 mm)', area); return; }
    const idx = getSizeIndex(d);
    if (idx < 0) { showError('尺寸超出 ISO 286 適用範圍', area); return; }
    area.innerHTML = renderShaft(d, idx, sym);
  }

  area.classList.add('show');
}

function showError(msg, area) {
  area.innerHTML = `<div class="error-msg">⚠ ${msg}</div>`;
  area.classList.add('show');
}

function renderHole(d, idx, sym) {
  const data = HOLE_DATA[sym];
  if (!data) return '';
  const [ES, EI] = data[idx];
  const tol = ES - EI;
  const usage = HOLE_USAGE[sym] || '';
  return `
  <div class="result-card hole">
    <div class="card-title">▐ 孔 HOLE</div>
    <div class="symbol-big">Ø${d} ${sym}</div>
    <div class="size-note">${getSizeLabel(d)}</div>
    <div class="tol-grid">
      <div class="tol-item">
        <div class="val ${valClass(ES)}">${fmtMM(ES)}</div>
        <div class="lbl">上偏差 ES (mm)</div>
      </div>
      <div class="tol-item">
        <div class="val ${valClass(EI)}">${fmtMM(EI)}</div>
        <div class="lbl">下偏差 EI (mm)</div>
      </div>
      <div class="tol-item">
        <div class="val" style="color:var(--accent)">${(tol/1000).toFixed(3)}</div>
        <div class="lbl">公差帶 IT (mm)</div>
      </div>
    </div>
    <div class="usage-text">💡 ${usage}</div>
  </div>`;
}

function renderShaft(d, idx, sym) {
  const data = SHAFT_DATA[sym];
  if (!data) return '';
  const [es, ei] = data[idx];
  const tol = es - ei;
  const usage = SHAFT_USAGE[sym] || '';
  return `
  <div class="result-card shaft">
    <div class="card-title">▐ 軸 SHAFT</div>
    <div class="symbol-big">Ø${d} ${sym}</div>
    <div class="size-note">${getSizeLabel(d)}</div>
    <div class="tol-grid">
      <div class="tol-item">
        <div class="val ${valClass(es)}">${fmtMM(es)}</div>
        <div class="lbl">上偏差 es (mm)</div>
      </div>
      <div class="tol-item">
        <div class="val ${valClass(ei)}">${fmtMM(ei)}</div>
        <div class="lbl">下偏差 ei (mm)</div>
      </div>
      <div class="tol-item">
        <div class="val" style="color:var(--accent)">${(tol/1000).toFixed(3)}</div>
        <div class="lbl">公差帶 IT (mm)</div>
      </div>
    </div>
    <div class="usage-text">💡 ${usage}</div>
  </div>`;
}

function renderFit(d, idx, hSym, sSym) {
  const hData = HOLE_DATA[hSym];
  const sData = SHAFT_DATA[sSym];
  if (!hData || !sData) return '';
  const [ES, EI] = hData[idx];
  const [es, ei] = sData[idx];

  // 最大間隙 = ES - ei (正=間隙, 負=過盈)
  // 最小間隙 = EI - es
  const maxClearance = ES - ei;
  const minClearance = EI - es;

  let fitType, badgeClass, fitDesc;
  if (minClearance > 0) {
    fitType = '間隙配合'; badgeClass = 'clearance'; fitDesc = '孔軸間有間隙，可相對移動，適用滑動/旋轉場合。';
  } else if (maxClearance < 0) {
    fitType = '過盈配合'; badgeClass = 'interference'; fitDesc = '孔軸間有過盈，需壓入或熱裝，不可相對移動，傳遞力矩靠摩擦力。';
  } else {
    fitType = '過渡配合'; badgeClass = 'transition'; fitDesc = '配合可能有間隙或過盈，依實際尺寸而定，需輕敲裝入，用於精密定位。';
  }

  const comboKey = `${hSym}/${sSym.toLowerCase()}`;
  const comboHint = FIT_COMBOS[`${hSym}/${sSym}`] || FIT_COMBOS[comboKey] || '';

  return `
  <div class="result-card fit">
    <div class="card-title">▐ 配合結果 FIT RESULT</div>
    <div class="symbol-big">${hSym} / ${sSym}</div>
    <div class="size-note">Ø${d} mm · ${getSizeLabel(d)}</div>
    <div style="margin-bottom:12px">
      <span class="fit-type-badge ${badgeClass}">${fitType}</span>
    </div>
    <div class="fit-row">
      <div class="fit-val">
        <div class="val ${maxClearance>0?'pos':'neg'}">${fmtMM(maxClearance)}</div>
        <div class="lbl">${maxClearance>=0?'最大間隙':'最大過盈'} (mm)</div>
      </div>
      <div class="fit-val">
        <div class="val ${minClearance>0?'pos':'neg'}">${fmtMM(minClearance)}</div>
        <div class="lbl">${minClearance>=0?'最小間隙':'最小過盈'} (mm)</div>
      </div>
    </div>
    <div class="usage-text">
      ⚙ ${fitDesc}${comboHint ? '<br>📌 ' + comboHint : ''}
    </div>
  </div>`;
}

function renderBar(upper, lower, color) {
  // 視覺化公差帶，以零線為中心
  const range = 300; // ±150μm 顯示範圍
  const centerPct = 50;
  const scale = 50 / 150;
  const uPct = centerPct + upper * scale;
  const lPct = centerPct + lower * scale;
  const leftPct = Math.min(uPct, lPct);
  const widthPct = Math.abs(uPct - lPct);

  return `
  <div class="tol-bar-wrap">
    <div class="tol-bar-label">公差帶位置示意（以零線為基準）</div>
    <div class="bar-track">
      <div class="zero-line"></div>
      <div class="tol-bar" style="left:${leftPct}%;width:${Math.max(widthPct,1)}%;background:${color}"></div>
    </div>
    <div style="position:relative;height:18px">
      <span class="zero-tag">零線 (0)</span>
    </div>
  </div>`;
}

// ── 配合建議資料庫 ──────────────────────────────────────────
// 格式: [孔, 軸, 精度(precise/normal/loose), 說明]
const FIT_SUGGESTIONS = [
  // 間隙配合
  ['H6','g5','precise','極小間隙，精密主軸、精密導柱'],
  ['H6','h5','precise','精密定位滑動，可手推裝入'],
  ['H7','f6','precise','小間隙旋轉，精密軸承蓋、連桿'],

  ['H7','h6','normal','精密定位滑動，可手推裝入'],
  ['H7','f7','normal','一般旋轉滑動，需潤滑'],
  ['H7','h7','normal','一般間隙定位，易裝拆'],
  ['H8','f7','normal','一般滑動機構，稍大間隙'],

  ['H8','k7','loose','較寬鬆過渡定位'],

  ['H7','s6','normal','重過盈，熱裝，重載傳動'],
  ['H7','s7','normal','最大重過盈，最大傳動力矩'],
  ['H6','p5','precise','精密重載壓入配合'],
  ['H8','s7','loose','較寬鬆重過盈，一般重載固定'],
];

function updateFitCombos() {
  const type = document.getElementById('sel-fit-type').value;
  const grade = document.getElementById('sel-fit-grade').value;
  const sel = document.getElementById('sel-fit-combo');

  const typeMap = { clearance:'間隙', transition:'過渡', interference:'過盈' };
  const typeLabel = typeMap[type];

  // 依類型篩選
  let matches = FIT_SUGGESTIONS.filter(([h, s, g, desc]) => {
    const isMatch =
      (type === 'clearance' && desc.includes('間隙')) ||
      (type === 'transition' && (desc.includes('過渡') || desc.includes('定位') && !desc.includes('過盈') && !desc.includes('壓入'))) ||
      (type === 'interference' && (desc.includes('過盈') || desc.includes('壓入') || desc.includes('熱裝')));
    const gradeOk = grade === 'precise' ? g === 'precise' :
                    grade === 'loose'   ? g === 'loose' :
                    g === 'normal';
    return isMatch && gradeOk;
  });

  // 若篩無結果，放寬精度限制
  if (matches.length === 0) {
    matches = FIT_SUGGESTIONS.filter(([h, s, g, desc]) => {
      return (type === 'clearance' && desc.includes('間隙')) ||
             (type === 'transition' && !desc.includes('過盈') && !desc.includes('壓入') && !desc.includes('熱裝') && !desc.includes('間隙')) ||
             (type === 'interference' && (desc.includes('過盈') || desc.includes('壓入') || desc.includes('熱裝')));
    });
  }

  sel.innerHTML = '';
  matches.forEach(([h, s, g, desc]) => {
    sel.innerHTML += `<option value="${h}/${s}">${h}/${s} — ${desc}</option>`;
  });
}

// ── 初始化選單 ──────────────────────────────────────────────
function initSelects() {
  const holeSyms = Object.keys(HOLE_DATA);
  const shaftSyms = Object.keys(SHAFT_DATA);

  const selHole = document.getElementById('sel-hole');
  const selShaftOnly = document.getElementById('sel-shaft-only');

  holeSyms.forEach(s => {
    selHole.innerHTML += `<option value="${s}">${s}</option>`;
  });
  shaftSyms.forEach(s => {
    selShaftOnly.innerHTML += `<option value="${s}">${s}</option>`;
  });

  updateFitCombos();
}

initSelects();
