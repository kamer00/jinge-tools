<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公差查詢 — 勁格科技</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3349;
    --accent: #f59e0b;
    --text: #e2e8f0;
    --muted: #8391a7;
    --red: #ef4444;
    --num: 'Consolas', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 24px; }
  .header img { height: 48px; display: block; margin: 0 auto 10px; }
  .header h1 { font-size: 1.35rem; color: var(--accent); letter-spacing: 0.08em; }
  .header p { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--num);
    font-size: 1.15rem;
    padding: 11px 12px;
    outline: none;
  }
  select { font-size: 1.05rem; }
  input:focus, select:focus { border-color: var(--accent); }
  select option, select optgroup { background: var(--surface2); }
  .hint { grid-column: 1 / -1; font-size: 0.75rem; color: var(--muted); }

  .result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 18px;
  }
  .result.empty { border-left-color: var(--border); color: var(--muted); font-size: 0.9rem; text-align: center; padding: 28px 18px; }
  .result.err { border-left-color: var(--red); color: var(--red); font-size: 0.9rem; }
  .title { font-family: var(--num); font-size: 1.5rem; font-weight: 700; }
  .kind { font-size: 0.8rem; color: var(--muted); margin: 2px 0 14px; }

  .limits { display: grid; gap: 8px; margin-bottom: 14px; }
  .limit {
    display: flex; align-items: baseline; justify-content: space-between;
    background: var(--surface2); border-radius: 8px; padding: 12px 16px;
  }
  .limit .lbl { font-size: 0.85rem; color: var(--muted); }
  .limit .v { font-family: var(--num); font-size: 2.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }

  .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .d { background: var(--bg); border-radius: 6px; padding: 8px; text-align: center; }
  .d .v { font-family: var(--num); font-size: 1rem; font-weight: 700; }
  .d .lbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .seg { font-size: 0.75rem; color: var(--muted); margin-top: 12px; text-align: right; }

  .foot { font-size: 0.7rem; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.6; }

  @media (max-width: 420px) {
    body { padding: 14px; }
    .limit .v { font-size: 1.75rem; }
  }
</style>
</head>
<body>

    <h1>⚙ ISO 286 公差查詢</h1>
    <p>輸入尺寸、選代號，直接顯示上下限</p>
  </div>

  <div class="inputs">
    <div>
      <label for="dia">公稱尺寸 (mm)</label>
      <input type="number" id="dia" min="0" max="630" step="any" inputmode="decimal" placeholder="例：50">
    </div>
    <div>
      <label for="sym">公差代號</label>
      <select id="sym"></select>
    </div>
    <div class="hint">小寫 = 軸（外徑），大寫 = 孔（內徑）。例：f8 是軸、H7 是孔。</div>
  </div>

  <div id="out" class="result empty">輸入尺寸並選擇代號</div>

  <div class="foot">依 ISO 286-1 / 286-2:2010 計算（與 CNS 4、JIS B 0401、GB/T 1800 數值相同）<br>適用 0–630 mm</div>
</div>

<script>
// ══ ISO 286 計算引擎 ═══════════════════════════════════════════
// 尺寸段規則：超過 a、至 b（含）。所有偏差單位 μm。

// 主尺寸段上限
const MAIN = [3,6,10,18,30,50,80,120,180,250,315,400,500,630];
const MAIN_LO = [0,3,6,10,18,30,50,80,120,180,250,315,400,500];

// 標準公差 IT（μm），對應 MAIN 各段
const IT = {
  5:  [4,5,6,8,9,11,13,15,18,20,23,25,27,32],
  6:  [6,8,9,11,13,16,19,22,25,29,32,36,40,44],
  7:  [10,12,15,18,21,25,30,35,40,46,52,57,63,70],
  8:  [14,18,22,27,33,39,46,54,63,72,81,89,97,110],
  9:  [25,30,36,43,52,62,74,87,100,115,130,140,155,175],
  10: [40,48,58,70,84,100,120,140,160,185,210,230,250,280],
  11: [60,75,90,110,130,160,190,220,250,290,320,360,400,440],
};

// 軸基本偏差（μm）。格式 [段上限, 值]，取第一個 d <= 段上限 者
// 上偏差 es：c d e f g h
const ES_SHAFT = {
  c: [[3,-60],[6,-70],[10,-80],[18,-95],[30,-110],[40,-120],[50,-130],[65,-140],[80,-150],
      [100,-170],[120,-180],[140,-200],[160,-210],[180,-230],[200,-240],[225,-260],[250,-280],
      [280,-300],[315,-330],[355,-360],[400,-400],[450,-440],[500,-480]],
  d: [[3,-20],[6,-30],[10,-40],[18,-50],[30,-65],[50,-80],[80,-100],[120,-120],[180,-145],
      [250,-170],[315,-190],[400,-210],[500,-230],[630,-260]],
  e: [[3,-14],[6,-20],[10,-25],[18,-32],[30,-40],[50,-50],[80,-60],[120,-72],[180,-85],
      [250,-100],[315,-110],[400,-125],[500,-135],[630,-145]],
  f: [[3,-6],[6,-10],[10,-13],[18,-16],[30,-20],[50,-25],[80,-30],[120,-36],[180,-43],
      [250,-50],[315,-56],[400,-62],[500,-68],[630,-76]],
  g: [[3,-2],[6,-4],[10,-5],[18,-6],[30,-7],[50,-9],[80,-10],[120,-12],[180,-14],
      [250,-15],[315,-17],[400,-18],[500,-20],[630,-22]],
  h: [[630,0]],
};
// 下偏差 ei：k m n p r s
const EI_SHAFT = {
  k: [[3,0],[6,1],[10,1],[18,1],[30,2],[50,2],[80,2],[120,3],[180,3],[250,4],[315,4],[400,4],[500,5],[630,0]],
  m: [[3,2],[6,4],[10,6],[18,7],[30,8],[50,9],[80,11],[120,13],[180,15],[250,17],[315,20],[400,21],[500,23],[630,26]],
  n: [[3,4],[6,8],[10,10],[18,12],[30,15],[50,17],[80,20],[120,23],[180,27],[250,31],[315,34],[400,37],[500,40],[630,44]],
  p: [[3,6],[6,12],[10,15],[18,18],[30,22],[50,26],[80,32],[120,37],[180,43],[250,50],[315,56],[400,62],[500,68],[630,78]],
  r: [[3,10],[6,15],[10,19],[18,23],[30,28],[50,34],[65,41],[80,43],[100,51],[120,54],[140,63],[160,65],
      [180,68],[200,77],[225,80],[250,84],[280,94],[315,98],[355,108],[400,114],[450,126],[500,132],[560,150],[630,155]],
  s: [[3,14],[6,19],[10,23],[18,28],[30,35],[50,43],[65,53],[80,59],[100,71],[120,79],[140,92],[160,100],
      [180,108],[200,122],[225,130],[250,140],[280,158],[315,170],[355,190],[400,208],[450,232],[500,252],[560,280],[630,310]],
};

// 提供選擇的代號
const SHAFT_CODES = ['c11','d9','d10','d11','e7','e8','e9','f6','f7','f8','f9','g5','g6','g7',
  'h5','h6','h7','h8','h9','h10','h11','js5','js6','js7','k5','k6','k7','m5','m6','m7',
  'n5','n6','n7','p5','p6','p7','r6','r7','s6','s7'];
const HOLE_CODES = ['C11','D9','D10','D11','E8','E9','F6','F7','F8','F9','G6','G7',
  'H6','H7','H8','H9','H10','H11','JS6','JS7','JS8','K6','K7','K8','M6','M7',
  'N6','N7','N8','P6','P7','R6','R7','S6','S7'];

function mainIdx(d) { return MAIN.findIndex(b => d <= b); }
function look(table, d) {
  const row = table.find(([b]) => d <= b);
  return row ? row[1] : null;
}
function segOf(table, d) {
  const i = table.findIndex(([b]) => d <= b);
  return [i === 0 ? 0 : table[i-1][0], table[i][0]];
}
function parse(code) {
  const m = code.match(/^([A-Za-z]+)(\d+)$/);
  return { letter: m[1], grade: +m[2], hole: m[1] !== m[1].toLowerCase() };
}

// 回傳 { up, lo, seg:[a,b] } 或 { error }
function calc(code, d) {
  const { letter, grade, hole } = parse(code);
  const l = letter.toLowerCase();
  const i = mainIdx(d);
  if (i < 0 || d <= 0) return { error: '尺寸需大於 0、不超過 630 mm' };
  if (grade === 5 && d > 500) return { error: `IT5（${code}）在 ISO 286 只定義到 500 mm` };
  if (l === 'c' && d > 500) return { error: `${code} 在 ISO 286 只定義到 500 mm` };

  const it = IT[grade][i];
  let seg = [MAIN_LO[i], MAIN[i]];
  let up, lo;

  if (l === 'js') {
    up = it / 2; lo = -it / 2;
  } else if (!hole) {
    // ── 軸 ──
    if (ES_SHAFT[l]) {
      up = look(ES_SHAFT[l], d); lo = up - it;
      if (l === 'c') seg = segOf(ES_SHAFT.c, d);
    } else {
      let ei = look(EI_SHAFT[l], d);
      if (l === 'k' && (grade < 4 || grade > 7)) ei = 0;   // k：僅 IT4–IT7 有正偏差
      lo = ei; up = ei + it;
      if (l === 'r' || l === 's') seg = segOf(EI_SHAFT[l], d);
    }
  } else {
    // ── 孔 ──
    if (ES_SHAFT[l]) {
      // A–H：EI = −es
      lo = -look(ES_SHAFT[l], d); up = lo + it;
      if (l === 'c') seg = segOf(ES_SHAFT.c, d);
    } else {
      const ei = look(EI_SHAFT[l], d);
      const delta = IT[grade][i] - IT[grade - 1][i];
      let ES;
      if (l === 'k' || l === 'm' || l === 'n') {
        if (d > 500) ES = -ei;
        else if (grade <= 8) ES = (d <= 3) ? -ei : -ei + delta;
        else ES = (l === 'm') ? -ei : 0;
        if (l === 'k' && d <= 3) ES = 0;
        if (l === 'm' && grade === 6 && d > 250 && d <= 315) ES = -9;   // ISO 286 特例
      } else {
        // P–S
        ES = (grade <= 7 && d > 3 && d <= 500) ? -ei + delta : -ei;
      }
      up = ES; lo = ES - it;
      if (l === 'r' || l === 's') seg = segOf(EI_SHAFT[l], d);
    }
  }
  return { up, lo, it, seg, hole };
}

// ══ 顯示 ══════════════════════════════════════════════════════
// d(mm) + dev(μm) → 尺寸字串，至少 3 位小數，0.5 μm 時顯示 4 位
function fmtSize(d, dev) {
  const v = Math.round(d * 10000 + dev * 10) / 10000;
  let s = v.toFixed(4);
  if (s.endsWith('0')) s = s.slice(0, -1);
  return s;
}
function fmtDev(dev) {
  if (dev === 0) return '0';
  let s = Math.abs(dev / 1000).toFixed(4);
  if (s.endsWith('0')) s = s.slice(0, -1);
  return (dev > 0 ? '+' : '−') + s;
}
function fmtNum(d) { return String(+d.toFixed(4)); }

function render() {
  const out = document.getElementById('out');
  const raw = document.getElementById('dia').value;
  const code = document.getElementById('sym').value;
  const d = parseFloat(raw);

  if (!raw || !code) {
    out.className = 'result empty';
    out.textContent = !raw && !code ? '輸入尺寸並選擇代號' : (!raw ? '請輸入公稱尺寸' : '請選擇公差代號');
    return;
  }
  const r = calc(code, d);
  if (r.error) {
    out.className = 'result err';
    out.textContent = '⚠ ' + r.error;
    return;
  }
  out.className = 'result';
  out.innerHTML = `
    <div class="title">Ø${fmtNum(d)} ${code}</div>
    <div class="kind">${r.hole ? '孔（內徑）' : '軸（外徑）'}</div>
    <div class="limits">
      <div class="limit"><span class="lbl">最大</span><span class="v">${fmtSize(d, r.up)}</span></div>
      <div class="limit"><span class="lbl">最小</span><span class="v">${fmtSize(d, r.lo)}</span></div>
    </div>
    <div class="details">
      <div class="d"><div class="v">${fmtDev(r.up)}</div><div class="lbl">上偏差 (mm)</div></div>
      <div class="d"><div class="v">${fmtDev(r.lo)}</div><div class="lbl">下偏差 (mm)</div></div>
      <div class="d"><div class="v">${fmtDev(r.it).replace('+','')}</div><div class="lbl">公差帶 (mm)</div></div>
    </div>
    <div class="seg">尺寸段：超過 ${r.seg[0]} 至 ${r.seg[1]} mm</div>`;
}

// ══ 初始化 ════════════════════════════════════════════════════
(function init() {
  const sel = document.getElementById('sym');
  let html = '<option value="">選擇代號</option>';
  html += '<optgroup label="軸（外徑）小寫">' + SHAFT_CODES.map(c => `<option>${c}</option>`).join('') + '</optgroup>';
  html += '<optgroup label="孔（內徑）大寫">' + HOLE_CODES.map(c => `<option>${c}</option>`).join('') + '</optgroup>';
  sel.innerHTML = html;
  document.getElementById('dia').addEventListener('input', render);
  sel.addEventListener('change', render);
})();

// 供驗證用
if (typeof module !== 'undefined') module.exports = { calc, SHAFT_CODES, HOLE_CODES };
</script>
</body>
</html>
