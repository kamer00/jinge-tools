<style>
:root{
  --bg:#14161a; --bg2:#1c1f25; --bg3:#22262e; --border:#2e333d;
  --text:#e8e9eb; --dim:#9aa1ad; --accent:#ff8c1a; --accent-dim:#c96e12;
  --blue:#4d9eff; --green:#4caf7d; --red:#ff6b6b; --yellow:#ffd166;
  --mono:'SFMono-Regular',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;padding-bottom:50px;}
header{background:linear-gradient(135deg,var(--bg2),var(--bg));border-bottom:2px solid var(--accent);padding:12px 16px;position:sticky;top:0;z-index:20;}
.hd{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.hd img{width:36px;height:36px;border-radius:8px;}
.hd h1{font-size:18px;flex:1;}
.hd p{font-size:11px;color:var(--dim);letter-spacing:1px;}
.back{font-size:12px;color:var(--dim);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;white-space:nowrap;}
main{max-width:960px;margin:0 auto;padding:14px 16px;}

.step{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.step-t{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.step-t .n{background:var(--accent);color:#141414;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer;font-family:inherit;}
.chip small{display:block;font-size:11px;color:var(--dim);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#141414;font-weight:700;}
.chip.on small{color:#3a2a10;}
.chip.sz{font-family:var(--mono);padding:8px 10px;font-size:13.5px;}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.custom label{font-size:12.5px;color:var(--dim);display:block;margin-bottom:4px;}
.custom input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:16px;padding:10px 12px;outline:none;}
.custom input:focus{border-color:var(--accent);}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px;}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.toggle .chip{text-align:center;font-size:15px;padding:12px;}

#out{display:none;}
.title-bar{background:var(--bg3);border:1px solid var(--accent-dim);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.title-bar .big{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);}
.title-bar .sub{font-size:13px;color:var(--dim);margin-top:2px;}
.grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr;}.span2{grid-column:1/3;}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card h3{font-size:14.5px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;}
.card h3 .n{color:#141414;background:var(--blue);border-radius:5px;padding:0 7px;font-size:12.5px;}
.item{padding:10px 14px;border-bottom:1px solid var(--border);}
.item:last-child{border-bottom:none;}
.item .k{font-size:13px;color:var(--dim);}
.item .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--text);}
.item .v.hl{color:var(--accent);}
.item .v.ok{color:var(--green);}
.item .why{font-size:12.5px;color:var(--dim);margin-top:2px;}
.warn{background:rgba(255,107,107,.08);border-left:3px solid var(--red);padding:9px 12px;font-size:13.5px;margin:10px 14px;border-radius:4px;}
.note{background:rgba(255,209,102,.07);border-left:3px solid var(--yellow);padding:9px 12px;font-size:13.5px;margin:10px 14px;border-radius:4px;}
table.pass{width:100%;border-collapse:collapse;font-size:14px;}
table.pass th,table.pass td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono);}
table.pass th{font-family:inherit;font-size:12px;color:var(--dim);font-weight:600;background:var(--bg3);}
table.pass td:first-child,table.pass th:first-child{text-align:left;font-family:inherit;}
table.pass tr.fin td{color:var(--green);}
table.pass tr.spr td{color:var(--dim);}
ul.list{padding:8px 14px 12px 32px;font-size:14px;}
ul.list li{margin:4px 0;}
.fig{padding:10px 8px 4px;}
.fig svg{width:100%;height:auto;display:block;}
footer{max-width:960px;margin:20px auto 0;padding:0 16px;font-size:12px;color:var(--dim);line-height:1.8;}
</style>
</head>

  m=s.match(/^(\d+)\/(\d+)$/); if(m) return m[1]/m[2];
  return parseFloat(s);
}
const f2=x=>x.toFixed(2), f3=x=>x.toFixed(3);
const isPipe=k=>['g','r','rp','npt'].includes(k);

function setSys(k){

/* ================== 共用輸出元件 ================== */
const IT=(k,v,why='',cls='')=>`<div class="item"><div class="k">${k}</div><div class="v ${cls}">${v}</div>${why?`<div class="why">${why}</div>`:''}</div>`;
const CARD=(n,t,body,span='')=>`<div class="card ${span}"><h3><span class="n">${n}</span>${t}</h3>${body}</div>`;

// 進刀表：遞減吃刀（等切削面積），最後 2 刀各 0.05 精車＋1 刀空走光刀
function passTable(total, ang){
  const comp = ang===60?29:27;          // 複式刀座角度（牙角一半再少約 1°）
  const k = 1/Math.cos(comp*Math.PI/180);
  const fin = Math.min(0.10, total*0.2);
  const rough = total - fin;
  // 粗車刀數依牙距（約 4 + 2×牙距），每刀吃深由大到小線性遞減，最後一刀粗車約 0.05
  const P = total/0.62;                 // 由牙深回推牙距（僅用於決定刀數）
  let n = Math.max(3, Math.round(4 + 2*P));
  const amin = 0.05;
  let a1 = 2*rough/n - amin;
  while(a1 < amin*1.2 && n > 3){ n--; a1 = 2*rough/n - amin; }
  const step = n>1 ? (a1-amin)/(n-1) : 0;
  const cum=[]; let c=0;
  for(let i=0;i<n;i++){ c += a1 - i*step; cum.push(c); }
  cum[n-1]=rough;
  cum.push(rough+fin/2, total);
  let rows='', prev=0;
  cum.forEach((c,i)=>{
    const cls = i>=n ? 'fin':'';
    rows+=`<tr class="${cls}"><td>${i+1}${i>=n?'（精車）':''}</td><td>${f2(c-prev)}</td><td>${f2(c)}</td><td>${f2(c*k)}</td></tr>`;
    prev=c;
  });
  rows+=`<tr class="spr"><td>${cum.length+1}（光刀）</td><td>0</td><td>${f2(total)}</td><td>${f2(total*k)}</td></tr>`;
  return {comp,k,html:`<table class="pass"><thead><tr><th>第幾刀</th><th>本刀吃深</th><th>累計（單邊）</th><th>複式刀座刻度累計</th></tr></thead><tbody>${rows}</tbody></table>`};
}

// 牙形示意圖（標示三個直徑）
function fig(ang, major, pitchD, minor, ext){
  const lab = ext ? ['外徑','有效徑','底徑'] : ['大徑','有效徑','內孔'];
  return `<div class="fig"><svg viewBox="0 0 470 175" font-family="sans-serif">
    <polyline points="15,40 35,40 63,120 83,120 111,40 131,40 159,120 179,120 207,40 222,40" fill="none" stroke="#ff8c1a" stroke-width="3"/>
    <line x1="5" y1="40" x2="228" y2="40" stroke="#4d9eff" stroke-dasharray="4 4"/>
    <line x1="5" y1="80" x2="228" y2="80" stroke="#4caf7d" stroke-dasharray="4 4"/>
    <line x1="5" y1="120" x2="228" y2="120" stroke="#ff6b6b" stroke-dasharray="4 4"/>
    <text x="236" y="45" fill="#4d9eff" font-size="17">${lab[0]} ${f2(major)}</text>
    <text x="236" y="85" fill="#4caf7d" font-size="17">${lab[1]} ${f2(pitchD)}</text>
    <text x="236" y="125" fill="#ff6b6b" font-size="17">${lab[2]} ${f2(minor)}</text>
    <text x="10" y="165" fill="#9aa1ad" font-size="15" text-anchor="start">牙角 ${ang}°（${ext?'公牙':'母牙'}示意，單位 mm）</text>
  </svg></div>`;
}

/* ================== 計算 ================== */
function calc(){
  const out=document.getElementById('out');
  if(isPipe(sys)){
    if(sel===null){ out.style.display='none'; return; }
    if(sys==='npt') return showNPT(NPT[sel]);
    return showPipe(PIPE[sel]);
  }
  const inch = sys==='unc'||sys==='unf';
  const dRaw=inD.value.trim(), pRaw=inP.value.trim();
  if(!dRaw||!pRaw){ out.style.display='none'; return; }
  let D = inch ? frac(dRaw)*25.4 : parseFloat(dRaw);
  let P = inch ? 25.4/parseFloat(pRaw) : parseFloat(pRaw);
  if(!(D>0)||!(P>0)){ alertBox('外徑或牙距格式不對，請重新輸入。'); return; }
  if(P > D/3){ alertBox('牙距相對外徑太大，請確認是否輸入顛倒（第一格是外徑、第二格是牙距）。'); return; }
  inch ? showUN(D,P,frac(dRaw),parseFloat(pRaw)) : showMetric(D,P);
}

/* ---------- 公制 ISO（6g／6H） ---------- */
function showMetric(D,P){
  const d2=D-0.649519*P, d3=D-1.226869*P, D1=D-1.082532*P;
  // ISO 965-1 公差公式（µm）
  const Td2=90*Math.pow(P,0.4)*Math.pow(D,0.1);
  const es=-(15+11*P);
  const Td=180*Math.pow(P,2/3)-3.15/Math.sqrt(P);
  const TD2=1.32*Td2, TD1=P>=1?230*Math.pow(P,0.7):(433*P-190*Math.pow(P,1.22));
  const odMax=D+es/1000, odMin=odMax-Td/1000;
  const d2Max=d2+es/1000, d2Min=d2Max-Td2/1000;
  const D1Min=D1, D1Max=D1+TD1/1000;
  const D2Min=d2, D2Max=d2+TD2/1000;
  const name = Number.isInteger(P) || true ? `M${D}×${P}` : '';
  common({title:name, sub:`公制 60°・牙距 ${P} mm・公差 ${gender==='ext'?'6g':'6H'}`, ang:60, D,P,d2,d3,D1,
    odMin,odMax,d2Min,d2Max,D1Min,D1Max,D2Min,D2Max, hExt:0.613435*P});
}

/* ---------- 英制 UN（2A／2B，ASME B1.1） ---------- */
function showUN(D,P,dIn,tpi){
  const p=1/tpi, di=dIn;
  const Td2A=0.0015*Math.cbrt(di)+0.0015*Math.sqrt(9*p)+0.015*Math.pow(p,2/3);
  const allow=0.300*Td2A, TD2B=1.300*Td2A, TdMaj=0.060*Math.pow(p,2/3);
  const TD1 = tpi>4 ? 0.25*p-0.40*p*p : 0.15*p;
  const IN=25.4;
  const d2=(di-0.649519*p)*IN, d3=(di-1.19078*p)*IN, D1=(di-1.082532*p)*IN;
  const odMax=(di-allow)*IN, odMin=(di-allow-TdMaj)*IN;
  const d2Max=(di-0.649519*p-allow)*IN, d2Min=d2Max-Td2A*IN;
  const D2Min=d2, D2Max=d2+TD2B*IN;
  const D1Min=D1, D1Max=D1+TD1*IN;
  common({title:`${inD.value.trim()}"-${tpi} ${sys.toUpperCase()}`, sub:`英制 60°・每吋 ${tpi} 牙（牙距 ${f3(P)} mm）・公差 ${gender==='ext'?'2A':'2B'}`,
    ang:60, D,P,d2,d3,D1, odMin,odMax,d2Min,d2Max,D1Min,D1Max,D2Min,D2Max, hExt:0.61343*P});
}

    html+=CARD('D','量測與檢驗',
      IT('有效徑（牙腰直徑）', `${f3(o.d2Min)} ～ ${f3(o.d2Max)} mm`, '用螺紋分厘卡或三針量這個尺寸','ok')+

      IT('用鑽頭時', `約 ${f2(o.D-o.P)} mm`, '小尺寸用絲攻時的底孔鑽頭（約等於外徑 − 牙距）')+

    html+=CARD('B','刀具與刀座',

      IT('換算成複式刀座刻度', `${f2(total*pt.k)} mm`, `沿 ${pt.comp}° 方向進刀時，刻度要多走（× ${f3(pt.k)}）`,'hl'));

/* ---------- 管牙 G／R／Rc／Rp（55°） ---------- */
function showPipe(t){
  const P=25.4/t.T, D=t.D, h=0.640327*P, d2=D-h, D1=D-1.280654*P;
  const ext=gender==='ext';
  let html='', title='', sub='';
  if(sys==='g'){
    title=`G ${t.s}`; sub=`管用平行螺紋 55°・每吋 ${t.T} 牙（牙距 ${f3(P)} mm）・舊稱 PF`;
    if(ext){
      const pt=passTable(h,55);
      html+=CARD('A','先車外徑',
        IT('外徑車到', `${f2(D-t.Td)} ～ ${f2(D)} mm`,'','hl')+
        IT('退刀槽', `寬 ${f2(2*P)} ～ ${f2(3*P)} mm，槽底直徑 ≤ ${f2(D1-0.2)} mm`));
      html+=toolCard(55,h,pt,true);

      html+=CARD('D','量測與檢驗',

        IT('檢驗','G 螺紋環規（通／止）','','ok'));
      html+=CARD('E','示意圖', fig(55,D,d2,D1,true));
    }else{
      html+=pipeIntCard(D,t,P);
      const bore=(t.gMin+t.gMax)/2, total=(D-bore)/2+0.02, pt=passTable(total,55);
      html+=toolCard(55,total,pt,false,bore,D);
      html+=CARD('C','每刀進刀表（越後面吃越少）', pt.html+`<div class="note">刻度盤若是直徑讀數，橫向數字請 ×2。</div>`,'span2');
      html+=CARD('D','量測與檢驗',
        IT('有效徑', `${f3(d2)} ～ ${f3(d2+t.Td2)} mm`,'','ok')+
        IT('檢驗','G 螺紋塞規（通／止）','','ok'));
      html+=CARD('E','示意圖', fig(55,D,d2,bore,false));
    }
  }else if(sys==='rp'){
    title=`Rp ${t.s}`; sub=`管用平行母牙 55°（配 R 錐度公牙）・每吋 ${t.T} 牙（牙距 ${f3(P)} mm）・舊稱 PS`;
    html+=pipeIntCard(D,t,P);
    const bore=(t.gMin+t.gMax)/2, total=(D-bore)/2+0.02, pt=passTable(total,55);
    html+=toolCard(55,total,pt,false,bore,D);
    html+=CARD('C','每刀進刀表（越後面吃越少）', pt.html,'span2');
    html+=CARD('D','量測與檢驗',
      IT('有效徑（基準）', `${f3(d2)} mm`,'','ok')+
      IT('檢驗', `用 R 錐度塞規：塞規端面要落在缺口範圍內（約 ±${f2(t.c)} mm）`,'','ok'));
  }else{ // R／Rc 錐度
    const small=D-t.a/16, large=D+(t.Le-t.a)/16;
    if(ext){
      title=`R ${t.s}`; sub=`管用錐度公牙 55°・錐度 1:16・每吋 ${t.T} 牙（牙距 ${f3(P)} mm）・舊稱 PT`;
      const pt=passTable(h,55);
      html+=CARD('A','先車錐度外徑',
        IT('小端（入口）外徑', `${f2(small)} mm`,`從端面量起 ${f2(t.a)} mm 處外徑 = ${f2(D)} mm（基準位置）`,'hl')+
        IT(`有效牙長 ${f2(t.Le)} mm 處外徑`, `${f2(large)} mm`,'','hl')+
        IT('錐度','1 : 16（直徑每 16 mm 長差 1 mm）',`小刀座／錐度靠模轉半角 1°47′24″`)+
        IT('牙要車多長', `至少 ${f2(t.Le)} mm（不含不完全牙）`));
      html+=toolCard(55,h,pt,true);
      html+=CARD('C','每刀進刀表（越後面吃越少）', pt.html+`<div class="warn">每一刀都必須沿錐度走，不能只橫向進刀，否則牙深前後不一。</div>`,'span2');
      html+=CARD('D','量測與檢驗',
        IT('檢驗', `R 錐度環規：工件小端要落在環規缺口範圍內（約 ±${f2(t.b)} mm，約 ±1 牙）`,'錐度牙不量尺寸，看量規旋入的位置','ok'));
      html+=CARD('E','示意圖', fig(55,D,d2,D-1.280654*P,true));
    }else{
      title=`Rc ${t.s}`; sub=`管用錐度母牙 55°・錐度 1:16・每吋 ${t.T} 牙（牙距 ${f3(P)} mm）・舊稱 PT`;
      const deep=D1-t.l/16;
      html+=CARD('A','先鑽孔、再車錐孔',
        IT('車錐孔前先鑽', `≤ ${f2(deep)} mm（例如 ${(Math.floor(deep*2)/2).toFixed(1)} mm）`,'鑽頭不可大於最深處內徑，再用車刀車成 1:16 錐孔','hl')+
        IT('直接用錐度絲攻時', `不鉸孔：${t.rcN} mm／先用錐度鉸刀：${t.rcR} mm`,'絲攻會自己切出錐度，最裡面幾牙不完整屬正常')+
        IT('孔口內徑（端面處）', `${f2(D1)} mm`,'孔口就是基準位置','hl')+
        IT(`深 ${f2(t.l)} mm 處內徑（最少要有效牙長 ${f2(t.l)} mm）`, `${f2(deep)} mm`,'越裡面越小（1:16）','hl')+
        IT('錐度','1 : 16',`小刀座轉半角 1°47′24″（方向與公牙相反）`));
      const total=h+0.02, pt=passTable(total,55);
      html+=toolCard(55,total,pt,false,D1,D);
      html+=CARD('C','每刀進刀表（越後面吃越少）', pt.html+`<div class="warn">每一刀都必須沿錐度走，不能只橫向進刀。</div>`,'span2');
      html+=CARD('D','量測與檢驗',
        IT('檢驗', `R 錐度塞規：孔口端面要落在塞規缺口範圍內（約 ±${f2(t.c)} mm）`,'錐度牙不量尺寸，看量規旋入的位置','ok'));
    }
  }
  render(title, sub, html);
}
function pipeIntCard(D,t,P){
  return CARD('A','先鑽孔／搪內孔',
    IT('內孔車到', `${f2(t.gMin)} ～ ${f2(t.gMax)} mm（建議 ${f2((t.gMin+t.gMax)/2)}）`,'孔太大牙會不完整','hl')+
    IT('用鑽頭時', `選 ${f2(t.gMin)} ～ ${f2(t.gMax)} mm 之間的鑽頭`)+
    IT('內退刀槽', `槽徑 ≥ ${f2(D+0.3)} mm，寬 ${f2(2*P)} ～ ${f2(3*P)} mm`));
}
function toolCard(ang,total,pt,ext,bore,D){
  return CARD('B','刀具與刀座',
    IT('牙刀角度', `${ang}°（注意：不是 60°）`, '管牙是 55° 英制牙形，用錯刀會漏油')+
    IT('複式刀座（小刀座）轉', `${pt.comp}°${ext?'':'（方向與車公牙相反）'}`)+
    IT('總吃刀深度（單邊、橫向）', `${f2(total)} mm`, ext?'理論值；最後以量規為準':`從內孔 ${f2(bore)} 起算，車到大徑 ${f2(D)}`,'hl')+
    IT('換算成複式刀座刻度', `${f2(total*pt.k)} mm`, `沿 ${pt.comp}° 方向進刀時刻度要多走（× ${f3(pt.k)}）`,'hl'));
}

/* ---------- NPT／NPTF（60°，錐度 1:16，截頂牙 0.8P） ---------- */
function showNPT(t){
  const IN=25.4, P=IN/t.T, h=0.8*P;
  const E0=t.E0*IN, L1=t.L1*IN, L2=t.L2*IN, E1=E0+L1/16;
  const ext=gender==='ext';
  let html='';
  const title=`${t.s}" NPT／NPTF`, sub=`美規錐度管牙 60°・錐度 1:16・每吋 ${t.T} 牙（牙距 ${f3(P)} mm）`;
  if(ext){
    const small=E0+h, OD=t.OD*IN, large=Math.min(E0+L2/16+h, OD), pt=passTable(h,60);
    html+=CARD('A','先車錐度外徑',
      IT('小端（入口）外徑', `約 ${f2(small)} mm`,'','hl')+
      IT(`往內車到管外徑為止`, `${f2(large)} mm（= 管外徑）`,'錐度往大端車，碰到管外徑後牙頂自然變不完整，屬正常','hl')+
      IT('錐度','1 : 16','小刀座／錐度靠模轉半角 1°47′24″')+
      IT('牙要車多長', `至少 ${f2(L2)} mm（有效牙長）`));
    html+=CARD('B','刀具與刀座',
      IT('牙刀角度','60°（牙頂、牙底是平的，NPTF 要求更嚴）','NPT 牙比一般 60° 牙淺，不可照公制牙深車')+
      IT('複式刀座（小刀座）轉', `${pt.comp}°`)+
      IT('總吃刀深度（單邊、橫向）', `${f2(h)} mm（= 0.8 × 牙距）`,'','hl')+
      IT('換算成複式刀座刻度', `${f2(h*pt.k)} mm`,'','hl'));
    html+=CARD('C','每刀進刀表（越後面吃越少）', pt.html+`<div class="warn">每一刀都必須沿錐度走，不能只橫向進刀。</div>`,'span2');
    html+=CARD('D','量測與檢驗',
      IT('小端有效徑（參考）', `${f3(E0)} mm`)+
      IT('檢驗', `L1 環規：手鎖到底時工件端面與環規面齊平，容許 ±1 牙（手旋入長 ${f2(L1)} mm）`,'','ok'));
  }else{
    const pt=passTable(h+0.02,60);
    html+=CARD('A','先鑽孔、再車錐孔',
      IT('車錐孔前先鑽', `≤ ${f2(E1-h-L2/16)} mm（例如 ${(Math.floor((E1-h-L2/16)*2)/2).toFixed(1)} mm）`,'鑽頭不可大於最深處內徑，再用車刀車成 1:16 錐孔','hl')+
      IT('直接用 NPT 絲攻時', `${t.drill} mm（${t.dr}）鑽頭`, t.chk===false?'此尺寸常見值未經第二來源核對，請以絲攻廠建議為準':'各家表格略有差異，以絲攻廠建議為準')+
      IT('孔口小徑（端面處）', `約 ${f2(E1-h)} mm`,'','hl')+
      IT(`深 ${f2(L2)} mm 處小徑`, `約 ${f2(E1-h-L2/16)} mm`,'越裡面越小','hl'));
    html+=CARD('B','刀具與刀座',
      IT('牙刀角度','60°（截頂牙）')+
      IT('複式刀座（小刀座）轉', `${pt.comp}°（方向與車公牙相反）`)+
      IT('總吃刀深度（單邊、橫向）', `${f2(h+0.02)} mm`,'','hl')+
      IT('換算成複式刀座刻度', `${f2((h+0.02)*pt.k)} mm`,'','hl'));
    html+=CARD('C','每刀進刀表（越後面吃越少）', pt.html+`<div class="warn">每一刀都必須沿錐度走，不能只橫向進刀。</div>`,'span2');
    html+=CARD('D','量測與檢驗',
      IT('孔口有效徑（參考）', `${f3(E1)} mm`)+
      IT('檢驗','L1 塞規：手鎖到底時塞規缺口與工件端面齊平，容許 ±1 牙','','ok'));
  }
  render(title, sub, html);
}

function render(title, sub, html){
  document.getElementById('out').style.display='block';
  document.getElementById('oTitle').textContent=title+'　'+(gender==='ext'?'公牙':'母牙');
  document.getElementById('oSub').textContent=sub;
  document.getElementById('oGrid').innerHTML=html;
}

const inD=document.getElementById('inD'), inP=document.getElementById('inP');
drawSys(); drawSizes(); drawGender();
</script>
