<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="研磨計算">
<link rel="manifest" href="manifest.json">
<title>外圓研磨計算機｜勁格科技</title>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #1c2330;
    --border:    #30363d;
    --accent:    #1a6fd4;
    --accent2:   #e8a020;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --green:     #2ea043;
    --red:       #da3633;
    --radius:    8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-wrap {
    width: 38px; height: 38px;
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .header-text h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  .header-text p  { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--accent2);
    font-weight: 600;
  }
  main {
    flex: 1;
    padding: 20px 16px 40px;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  label .unit { color: var(--accent2); margin-left: 4px; }
  .input-wrap { position: relative; display: flex; align-items: center; }
  .input-prefix {
    position: absolute; left: 12px;
    font-size: 14px; color: var(--accent2);
    font-weight: 700; pointer-events: none; user-select: none;
  }
  input[type=number] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px; font-weight: 600;
    padding: 10px 50px 10px 32px;
    outline: none;
    transition: border-color .15s;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,111,212,.15);
  }
  .input-unit { position: absolute; right: 12px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pass-toggle { display: flex; gap: 8px; }
  .pass-btn {
    flex: 1; padding: 10px 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--muted);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s; text-align: center;
  }
  .pass-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pass-btn:not(.active):hover { border-color: var(--accent); color: var(--text); }
  .result-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
  }
  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-label { color: var(--muted); }
  .result-value { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .result-value.accent { color: var(--accent2); }
  .result-value.green  { color: #3fb950; }
  .total-card {
    background: linear-gradient(135deg, #0e2a4a 0%, #0d1a2e 100%);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px; text-align: center; margin-bottom: 16px;
  }
  .total-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .total-value { font-size: 36px; font-weight: 900; color: var(--accent2); letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .total-sub   { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .formula-box {
    background: var(--bg); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 12px 14px; font-size: 11px; color: var(--muted); line-height: 1.8;
  }
  .formula-box span { color: var(--accent2); font-weight: 700; }
  .btn-reset {
    width: 100%; padding: 12px;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--muted);
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); }
  .zero-state { text-align: center; padding: 30px 0; color: var(--muted); font-size: 13px; }
  .zero-state .icon { font-size: 32px; margin-bottom: 8px; opacity: .4; }
  footer { text-align: center; padding: 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
</style>
</head>
<body>

  <div class="header-text">
    <h1>外圓研磨計算機</h1>
    <p>勁格科技股份有限公司</p>
  </div>

</header>

<main>
  <div class="card">
    <div class="card-title">工件尺寸</div>
    <div class="grid-2">
      <div class="field">
        <label>研磨直徑 <span class="unit">mm</span></label>
        <div class="input-wrap">
          <span class="input-prefix">Ø</span>
          <input type="number" id="diameter" min="0" step="0.1" placeholder="0.0">
          <span class="input-unit">mm</span>
        </div>
      </div>
      <div class="field">
        <label>研磨長度 <span class="unit">mm</span></label>
        <div class="input-wrap">
          <span class="input-prefix">L</span>
          <input type="number" id="length" min="0" step="1" placeholder="0">
          <span class="input-unit">mm</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">研磨設定</div>
    <div class="field">
      <label>研磨次數</label>
      <div class="pass-toggle">
        <button class="pass-btn active" data-pass="1" onclick="setPass(1)">一次研磨</button>
        <button class="pass-btn" data-pass="2" onclick="setPass(2)">二次研磨</button>
      </div>
    </div>
  </div>

  <div id="results">
    <div class="zero-state"><div class="icon">⚙️</div>輸入尺寸後自動計算</div>
  </div>

  <div class="formula-box">
    面積 = <span>π × Ø(in) × L(in)</span>｜
    第一次 = <span>面積 × 2.5</span>｜
    第二次 = <span>面積 × 2.5 × 1.5</span>
  </div>
  <br>
  <button class="btn-reset" onclick="resetAll()">⟳ 清除重填</button>
</main>

<footer>勁格科技股份有限公司 · 外圓研磨報價工具</footer>

<script>
let passes = 1;
function setPass(n) {
  passes = n;
  document.querySelectorAll('.pass-btn').forEach(b => b.classList.toggle('active', +b.dataset.pass === n));
  calculate();
}
function mm2in(mm) { return mm / 25.4; }
function fmt(n) { return 'NT$ ' + n.toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function calculate() {
  const D  = parseFloat(document.getElementById('diameter').value) || 0;
  const L  = parseFloat(document.getElementById('length').value)   || 0;
  const el = document.getElementById('results');
  if (D <= 0 || L <= 0) {
    el.innerHTML = '<div class="zero-state"><div class="icon">⚙️</div>輸入尺寸後自動計算</div>';
    return;
  }
  const area  = Math.PI * mm2in(D) * mm2in(L);
  const cost1 = area * 2.5;
  const cost2 = area * 2.5 * 1.5;
  const total = passes === 1 ? cost1 : cost1 + cost2;
  let rows = `
    <div class="result-row">
      <span class="result-label">研磨面積（單件）</span>
      <span class="result-value accent">${area.toFixed(2)} in²</span>
    </div>
    <div class="result-row">
      <span class="result-label">第一次研磨費（× 2.5）</span>
      <span class="result-value">${fmt(cost1)}</span>
    </div>`;
  if (passes === 2) {
    rows += `
    <div class="result-row">
      <span class="result-label">第二次研磨費（× 2.5 × 1.5）</span>
      <span class="result-value">${fmt(cost2)}</span>
    </div>`;
  }
  rows += `
    <div class="result-row">
      <span class="result-label">單件費用</span>
      <span class="result-value green">${fmt(total)}</span>
    </div>`;
  el.innerHTML = `
    <div class="result-card">${rows}</div>
    <div class="total-card">
      <div class="total-label">合計金額</div>
      <div class="total-value">${fmt(total)}</div>
      <div class="total-sub">Ø${D} × L${L} mm · ${passes === 1 ? '一次研磨' : '二次研磨'}</div>
    </div>`;
}
function resetAll() {
  document.getElementById('diameter').value = '';
  document.getElementById('length').value   = '';
  setPass(1);
  document.getElementById('results').innerHTML =
    '<div class="zero-state"><div class="icon">⚙️</div>輸入尺寸後自動計算</div>';
}
['diameter','length'].forEach(id => document.getElementById(id).addEventListener('input', calculate));
</script>
</body>
</html>
