<style>
  :root{
    --bg:#14161a; --bg2:#1c1f25; --bg3:#22262e; --border:#2e333d;
    --text:#e8e9eb; --text-dim:#9aa1ad; --accent:#ff8c1a; --accent-dim:#c96e12;
    --blue:#4d9eff; --green:#4caf7d; --purple:#a67bff; --red:#ff6b6b;
    --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height:100vh; padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg, var(--bg2) 0%, var(--bg) 100%);
    border-bottom:2px solid var(--accent);
    padding:22px 24px 18px;
    position:sticky; top:0; z-index:50;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .brand-mark{
    width:40px; height:40px; border-radius:9px;
    overflow:hidden; flex-shrink:0;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand-text h1{font-size:19px; font-weight:700; letter-spacing:.5px;}
  .brand-text p{font-size:11.5px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-top:1px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .search-box{
    flex:1; min-width:220px; position:relative;
  }
  .search-box input{
    width:100%; background:var(--bg3); border:1px solid var(--border);
    border-radius:8px; padding:11px 14px 11px 38px; color:var(--text);
    font-size:14px; outline:none; transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--accent);}
  .search-box::before{
    content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--text-dim); font-size:17px; pointer-events:none;
  }
  .cat-filters{display:flex; flex-wrap:wrap; gap:7px;}
  .cat-btn{
    background:var(--bg3); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 13px; border-radius:20px; font-size:12.5px; cursor:pointer;
    white-space:nowrap; transition:all .15s; font-weight:500;
  }
  .cat-btn:hover{border-color:var(--accent-dim); color:var(--text);}
  .cat-btn.active{background:var(--accent); border-color:var(--accent); color:#141414; font-weight:700;}
  .stats-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 24px; font-size:12px; color:var(--text-dim);
    border-bottom:1px solid var(--border); background:var(--bg2);
  }
  .compare-hint{color:var(--accent); font-weight:600;}
  .compare-hint.dim{color:var(--text-dim); font-weight:400;}
  #compareBar{
    display:none; padding:10px 24px; background:var(--bg3); border-bottom:1px solid var(--accent-dim);
    align-items:center; gap:10px; flex-wrap:wrap;
  }
  #compareBar.show{display:flex;}
  .compare-chip{
    background:var(--bg); border:1px solid var(--accent); border-radius:6px;
    padding:5px 10px; font-size:12px; display:flex; align-items:center; gap:6px;
  }
  .compare-chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; line-height:1;}
  .btn-compare{
    background:var(--accent); color:#141414; border:none; border-radius:6px;
    padding:7px 16px; font-size:12.5px; font-weight:700; cursor:pointer; margin-left:auto;
  }
  .btn-compare:disabled{background:var(--border); color:var(--text-dim); cursor:not-allowed;}
  .btn-clear{background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:6px; padding:7px 12px; font-size:12.5px; cursor:pointer;}

  main{max-width:1180px; margin:0 auto; padding:18px 24px;}
  .group-title{
    font-size:13px; color:var(--accent); font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; margin:26px 0 10px; padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .group-title:first-child{margin-top:6px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px;}
  .card{
    background:var(--bg2); border:1px solid var(--border); border-radius:10px;
    padding:15px 16px; cursor:pointer; transition:all .15s; position:relative;
  }
  .card:hover{border-color:var(--accent-dim); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .card.selected{border-color:var(--accent); background:#241d14;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:9px;}
  .card-id{font-family:var(--mono); font-size:17px; font-weight:700; color:var(--text);}
  .card-check{
    width:20px; height:20px; border-radius:5px; border:1.5px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px;
    color:#141414; transition:all .15s;
  }
  .card.selected .card-check{background:var(--accent); border-color:var(--accent);}
  .std-row{display:flex; font-size:12.5px; padding:3px 0; gap:8px;}
  .std-label{color:var(--text-dim); width:76px; flex-shrink:0; font-size:11px; padding-top:1px;}
  .std-val{font-family:var(--mono); color:var(--text); word-break:break-word;}
  .card-app{
    margin-top:10px; padding-top:9px; border-top:1px dashed var(--border);
    font-size:11.5px; color:var(--text-dim); line-height:1.5;
  }
  .card-app b{color:var(--green); font-weight:600;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty-state div:first-child{font-size:32px; margin-bottom:10px;}

  /* Modal detail */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
    z-index:100; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--bg2); border:1px solid var(--accent-dim); border-radius:12px;
    max-width:680px; width:100%; padding:24px 26px; margin-top:0;
  }
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .modal-head h2{font-family:var(--mono); font-size:24px; color:var(--accent);}
  .modal-close{background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; padding:6px 10px; margin:-6px -8px 0 0;}
  .modal-cat{font-size:12px; color:var(--text-dim); margin-bottom:18px;}
  .modal-table{width:100%; border-collapse:collapse; margin-bottom:18px;}
  .modal-table tr{border-bottom:1px solid var(--border);}
  .modal-table td{padding:9px 4px; font-size:13.5px;}
  .modal-table td:first-child{color:var(--text-dim); width:110px; font-size:12px;}
  .modal-table td:last-child{font-family:var(--mono); font-weight:600;}
  .modal-sec{margin-top:16px;}
  .modal-sec h4{font-size:11.5px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .modal-sec p{font-size:13.5px; line-height:1.7; color:var(--text);}

  /* Compare modal */
  .cmp-modal{max-width:960px;}
  .cmp-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .cmp-table th, .cmp-table td{padding:9px 10px; border:1px solid var(--border); text-align:left; vertical-align:top;}
  .cmp-table th{background:var(--bg3); color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
  .cmp-table td:first-child{color:var(--text-dim); font-size:11px; white-space:nowrap; background:var(--bg3);}
  .cmp-table td{font-family:var(--mono);}
  .cmp-table td.txt{font-family:inherit; font-size:12.5px; line-height:1.6;}
  .cmp-scroll{overflow-x:auto;}

  footer{text-align:center; padding:26px 20px 10px; color:var(--text-dim); font-size:11.5px; line-height:1.8;}

  @media (max-width:640px){
    header{padding:14px 12px 12px;}
    .brand-mark{width:34px; height:34px; font-size:13px;}
    .brand-text h1{font-size:16.5px;}
    .brand-text p{font-size:10px;}
    .toolbar{gap:8px;}
    .search-box input{padding:10px 12px 10px 34px; font-size:16px;} /* 16px 避免 iOS 自動縮放 */
    .cat-filters{gap:6px;}
    .cat-btn{padding:7px 11px; font-size:12px;}
    main{padding:12px 12px;}
    .grid{grid-template-columns:1fr; gap:10px;}
    .stats-bar{padding:8px 12px; font-size:11px;}
    #compareBar{padding:8px 12px;}

const CATEGORIES = ['全部','碳鋼','合金結構鋼','不鏽鋼','鑄鐵','銅合金','工具鋼','軸承鋼','氮化鋼','彈簧鋼'];
const STD_LABELS = {cns:'CNS 台灣', jis:'JIS 日本', gb:'GB 中國', astm:'ASTM/AISI 美國', uns:'UNS 美國', din:'DIN 德國', en:'EN 歐盟'};

let activeCategory = '全部';
let searchTerm = '';
let selectedIds = new Set();

function initFilters(){
  const wrap = document.getElementById('catFilters');
  CATEGORIES.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat===activeCategory ? ' active':'');
    btn.textContent = cat;
    btn.onclick = ()=>{ activeCategory = cat; render(); };
    btn.dataset.cat = cat;
    wrap.appendChild(btn);
  });
}

function matchesSearch(item, term){
  if(!term) return true;
  const t = term.toLowerCase();
  const hay = [item.id, item.category, item.comp, item.prop, item.app, ...Object.values(item.names)]
    .join(' ').toLowerCase();
  return hay.includes(t);
}

function render(){
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat===activeCategory);
  });

  const filtered = DB.filter(item=>{
    const catOk = activeCategory==='全部' || item.category===activeCategory;
    return catOk && matchesSearch(item, searchTerm);
  });

  document.getElementById('resultCount').textContent = `共 ${filtered.length} 筆材料`;

  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  if(filtered.length===0){
    main.innerHTML = `<div class="empty-state"><div>🔍</div><div>查無符合條件的材料，請調整搜尋關鍵字或分類。</div></div>`;
    return;
  }

  const groups = {};
  filtered.forEach(item=>{
    if(!groups[item.category]) groups[item.category] = [];
    groups[item.category].push(item);
  });

  const orderedCats = CATEGORIES.filter(c=>c!=='全部' && groups[c]);

  orderedCats.forEach(cat=>{
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = cat;
    main.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[cat].forEach(item=>{
      grid.appendChild(buildCard(item));
    });
    main.appendChild(grid);
  });
}

function buildCard(item){
  const card = document.createElement('div');
  card.className = 'card' + (selectedIds.has(item.id) ? ' selected':'');
  card.onclick = (e)=>{
    if(e.target.closest('.card-check')){
      toggleSelect(item.id);
    } else {
      openDetail(item.id);
    }
  };

  const stdRows = Object.entries(item.names).map(([k,v])=>
    `<div class="std-row"><span class="std-label">${STD_LABELS[k]||k}</span><span class="std-val">${v}</span></div>`
  ).join('');

  card.innerHTML = `
    <div class="card-top">
      <span class="card-id">${item.id}</span>
      <span class="card-check" title="加入比對">${selectedIds.has(item.id)?'✓':''}</span>
    </div>
    ${stdRows}
    <div class="card-app"><b>用途</b> ${item.app}</div>
  `;
  return card;
}

function toggleSelect(id){
  if(selectedIds.has(id)){
    selectedIds.delete(id);
  } else {
    if(selectedIds.size>=4){ alert('最多可同時比對 4 項材料'); return; }
    selectedIds.add(id);
  }
  renderCompareBar();
  render();
}

function renderCompareBar(){
  const bar = document.getElementById('compareBar');
  const chips = document.getElementById('compareChips');
  const btn = document.getElementById('btnDoCompare');
  const hint = document.getElementById('compareHint');

  if(selectedIds.size===0){
    bar.classList.remove('show');
    hint.classList.add('dim');
    hint.textContent = '點選卡片可勾選加入比對（最多 4 項）';
    return;
  }
  hint.classList.remove('dim');
  hint.textContent = `已選 ${selectedIds.size} 項材料`;
  bar.classList.add('show');
  chips.innerHTML = '';
  [...selectedIds].forEach(id=>{
    const chip = document.createElement('div');
    chip.className = 'compare-chip';
    chip.innerHTML = `<span>${id}</span><button onclick="event.stopPropagation();toggleSelect('${id}')">×</button>`;
    chips.appendChild(chip);
  });
  btn.disabled = selectedIds.size<2;
}

function clearCompare(){
  selectedIds.clear();
  renderCompareBar();
  render();
}

function openDetail(id){
  const item = DB.find(d=>d.id===id);
  if(!item) return;
  const rows = Object.entries(item.names).map(([k,v])=>
    `<tr><td>${STD_LABELS[k]||k}</td><td>${v}</td></tr>`
  ).join('');
  document.getElementById('detailContent').innerHTML = `
    <div class="modal-head">
      <h2>${item.id}</h2>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-cat">${item.category}</div>
    <table class="modal-table">${rows}</table>
    <div class="modal-sec"><h4>化學成分（主要元素, wt%）</h4><p>${item.comp}</p></div>
    <div class="modal-sec"><h4>特性</h4><p>${item.prop}</p></div>
    <div class="modal-sec"><h4>常見用途</h4><p>${item.app}</p></div>
  `;
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail(){ document.getElementById('detailModal').classList.remove('show'); }

function openCompare(){
  const items = DB.filter(d=>selectedIds.has(d.id));
  if(items.length<2) return;

  const stdKeys = Object.keys(STD_LABELS);
  let head = '<tr><th>項目</th>' + items.map(i=>`<th>${i.id}</th>`).join('') + '</tr>';
  let rows = '';
  rows += `<tr><td>分類</td>` + items.map(i=>`<td class="txt">${i.category}</td>`).join('') + `</tr>`;
  stdKeys.forEach(k=>{
    rows += `<tr><td>${STD_LABELS[k]}</td>` + items.map(i=>`<td>${i.names[k]||'—'}</td>`).join('') + `</tr>`;
  });
  rows += `<tr><td>化學成分</td>` + items.map(i=>`<td class="txt">${i.comp}</td>`).join('') + `</tr>`;
  rows += `<tr><td>特性</td>` + items.map(i=>`<td class="txt">${i.prop}</td>`).join('') + `</tr>`;
  rows += `<tr><td>用途</td>` + items.map(i=>`<td class="txt">${i.app}</td>`).join('') + `</tr>`;

  document.getElementById('compareContent').innerHTML = `
    <div class="modal-head">
      <h2 style="font-size:19px;">材料比對</h2>
      <button class="modal-close" onclick="closeCompareModal()">×</button>
    </div>
    <div class="cmp-scroll"><table class="cmp-table"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
  `;
  document.getElementById('compareModal').classList.add('show');
}
function closeCompareModal(){ document.getElementById('compareModal').classList.remove('show'); }

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  render();
});

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ closeDetail(); closeCompareModal(); }
});

initFilters();
render();
</script>
